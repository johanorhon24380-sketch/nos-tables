<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Conseillers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#00953b;--green-d:#007a30;--green-dd:#006128;--green-l:#e9f6ee;--green-xl:#f4fbf6;
    --ink:#1c2b22;--muted:#6a7a70;--bg:#f4f8f5;--card:#fff;--border:#e2ece6;
    --amber:#e0a81e;--ok:#00953b;--ko:#d25151;
    --sh:0 2px 12px rgba(0,80,35,.06);--sh-h:0 8px 26px rgba(0,80,35,.12);
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);}

  .app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{width:256px;background:linear-gradient(180deg,var(--green),var(--green-dd));color:#fff;
    position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;z-index:40;transition:transform .25s;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
  .brand .logo{width:38px;height:38px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);font-size:1.1rem;flex-shrink:0;}
  .brand .txt b{display:block;font-size:1.02rem;font-weight:800;line-height:1.1;}
  .brand .txt span{font-size:.72rem;opacity:.75;}
  .nav-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;opacity:.6;margin:14px 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;font-size:.92rem;font-weight:500;color:rgba(255,255,255,.9);margin-bottom:2px;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,.12);}
  .nav-item.active{background:#fff;color:var(--green-d);font-weight:700;box-shadow:var(--sh);}
  .nav-item .ic{width:22px;text-align:center;font-size:1rem;flex-shrink:0;}
  .nav-item.tdb{font-size:1rem;font-weight:700;padding:13px 12px;}
  .nav-item .av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
  .nav-item.active .av{background:var(--green-l);color:var(--green-d);}
  .nav-add{margin-top:4px;border:1px dashed rgba(255,255,255,.4);justify-content:center;font-size:.85rem;opacity:.9;}
  .side-foot{margin-top:auto;font-size:.7rem;opacity:.6;padding:14px 10px 4px;line-height:1.5;}

  /* ---------- MAIN ---------- */
  .main{flex:1;margin-left:256px;min-width:0;}
  .topbar{display:none;align-items:center;gap:12px;background:var(--green);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;}
  .burger{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:1.2rem;width:38px;height:38px;border-radius:9px;cursor:pointer;}
  .content{padding:26px 30px 70px;max-width:1000px;margin:0 auto;}

  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .page-head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  .page-head .big-av{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;}
  .page-head .sp{flex:1;}
  .mini{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:.83rem;font-weight:600;cursor:pointer;color:var(--muted);}
  .mini:hover{border-color:var(--green);color:var(--green-d);}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:14px;margin-bottom:24px;}
  .c{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);}
  .c .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  .c .val{font-size:1.9rem;font-weight:800;color:var(--green-d);margin-top:5px;line-height:1;}
  .c .sub{font-size:.72rem;color:var(--muted);margin-top:4px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:12px 11px;text-align:center;border-bottom:1px solid #eef4f0;font-size:.88rem;}
  th{background:var(--green-xl);color:var(--green-dd);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
  th:first-child,td:first-child{text-align:left;}
  tbody tr:hover{background:var(--green-xl);}
  tr:last-child td{border-bottom:none;}
  tfoot td{background:var(--green-l);font-weight:800;color:var(--green-dd);border-bottom:none;}
  .stars{color:var(--amber);letter-spacing:1px;white-space:nowrap;}
  .stars .off{color:#dfe7e2;}
  .rowname{cursor:pointer;color:var(--green-d);font-weight:600;}
  .rowname:hover{text-decoration:underline;}

  /* entry table inputs */
  td input,td select{width:100%;border:1px solid transparent;border-radius:7px;padding:7px 6px;font-family:inherit;font-size:.86rem;background:transparent;outline:none;text-align:center;color:var(--ink);}
  td input:focus,td select:focus{border-color:var(--green);background:#fff;}
  td input.txt{text-align:left;}
  td.num input{font-weight:700;}
  .chk{width:18px;height:18px;accent-color:var(--green);}
  .addrow td{background:var(--green-xl);padding:8px;}
  .btn{background:var(--green);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--green-d);}
  .del{background:transparent;border:none;color:#c6d2cb;cursor:pointer;font-size:.95rem;}
  .del:hover{color:var(--ko);}

  .legend{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-top:22px;box-shadow:var(--sh);}
  .legend h3{font-size:.98rem;margin-bottom:6px;}
  .legend p{font-size:.82rem;color:var(--muted);margin-bottom:8px;}
  .legend .lr{display:flex;gap:11px;align-items:center;font-size:.85rem;padding:3px 0;}
  .legend .lr b{min-width:92px;}
  .empty{padding:34px;text-align:center;color:var(--muted);}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}

  @media(max-width:820px){
    .sidebar{transform:translateX(-100%);box-shadow:var(--sh-h);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:18px 16px 60px;}
    .backdrop.show{display:block;}
  }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">M</div>
      <div class="txt"><b>Suivi Conseillers</b><span>MGEN — TDB Collectif</span></div>
    </div>
    <div class="nav-item tdb" data-route="dash"><span class="ic">📊</span> Tableau de bord</div>
    <div class="nav-lbl">Conseillers</div>
    <div id="navConseillers"></div>
    <div class="nav-item nav-add" id="navAdd">+ Ajouter un conseiller</div>
    <div class="side-foot">Données enregistrées automatiquement sur ce poste.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger">☰</button>
      <b id="topTitle">Tableau de bord</b>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";
const KEY='suiviConseillers_v3';
const ORIGINES=['Receveur','Passeur','Appel entrant','Recommandation','Campagne','Spontané','Autre'];
let state=load();
let route='dash';   // 'dash' ou index conseiller

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return{conseillers:[
    {name:'Judicaël',contacts:[]},{name:'Stéphane',contacts:[]},
    {name:'Johan',contacts:[]},{name:'Justine',contacts:[]},{name:'Conseiller 5',contacts:[]}
  ]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function stars(t){return t>=60?5:t>=45?4:t>=30?3:t>=15?2:1;}
function starStr(n){let s='';for(let i=1;i<=5;i++)s+=i<=n?'★':'<span class="off">★</span>';return s;}
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';}
function newContact(){return{adh:'',origine:'',date:'',rdv:true,propos:0,adh_nb:0,relance:false};}
function stats(c){
  let s={contacts:c.contacts.length,rdv:0,propos:0,adh:0,relance:0};
  c.contacts.forEach(x=>{if(x.rdv)s.rdv++;s.propos+=+x.propos||0;s.adh+=+x.adh_nb||0;if(x.relance)s.relance++;});
  s.taux=pct(s.adh,s.propos);return s;
}

/* ---------- SIDEBAR NAV ---------- */
function renderNav(){
  document.getElementById('navConseillers').innerHTML=state.conseillers.map((c,i)=>
    `<div class="nav-item ${route===i?'active':''}" data-route="${i}">
       <span class="av">${initials(c.name)}</span>${esc(c.name)}</div>`).join('');
  document.querySelector('.nav-item.tdb').classList.toggle('active',route==='dash');
}

/* ---------- ROUTING ---------- */
function go(r){route=r;renderNav();render();closeSidebar();}
function render(){
  document.getElementById('topTitle').textContent=route==='dash'?'Tableau de bord':state.conseillers[route].name;
  if(route==='dash')renderDash();else renderConseiller(route);
}

/* ---------- DASHBOARD ---------- */
function renderDash(){
  const T={contacts:0,rdv:0,propos:0,adh:0,relance:0};
  state.conseillers.forEach(c=>{const s=stats(c);T.contacts+=s.contacts;T.rdv+=s.rdv;T.propos+=s.propos;T.adh+=s.adh;T.relance+=s.relance;});
  const taux=pct(T.adh,T.propos);
  let rows=state.conseillers.map((c,i)=>{const s=stats(c);
    return `<tr><td><span class="rowname" data-goto="${i}">${esc(c.name)}</span></td>
      <td>${s.contacts}</td><td>${s.rdv}</td><td>${s.propos}</td><td>${s.adh}</td>
      <td>${s.relance}</td><td>${s.taux}%</td><td class="stars">${starStr(stars(s.taux))}</td></tr>`;}).join('');

  document.getElementById('content').innerHTML=`
    <div class="page-head"><h2>📊 Tableau de bord</h2></div>
    <div class="cards">
      <div class="c"><div class="lbl">Conseillers</div><div class="val">${state.conseillers.length}</div></div>
      <div class="c"><div class="lbl">RDV honorés</div><div class="val">${T.rdv}</div><div class="sub">sur ${T.contacts} contacts</div></div>
      <div class="c"><div class="lbl">Propositions</div><div class="val">${T.propos}</div></div>
      <div class="c"><div class="lbl">Adhésions</div><div class="val">${T.adh}</div></div>
      <div class="c"><div class="lbl">Relances</div><div class="val">${T.relance}</div></div>
      <div class="c"><div class="lbl">Taux transfo. équipe</div><div class="val">${taux}%</div><div class="sub">adhésions ÷ propositions</div></div>
    </div>
    <div class="panel scroll"><table>
      <thead><tr><th>Conseiller</th><th>Contacts</th><th>RDV honorés</th><th>Propositions</th>
        <th>Adhésions</th><th>Relances</th><th>Taux transfo.</th><th>Note</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" class="empty">Aucun conseiller.</td></tr>'}</tbody>
      <tfoot><tr><td>Total équipe</td><td>${T.contacts}</td><td>${T.rdv}</td><td>${T.propos}</td>
        <td>${T.adh}</td><td>${T.relance}</td><td>${taux}%</td><td></td></tr></tfoot>
    </table></div>
    <div class="legend">
      <h3>⭐ Comment se calcule la note</h3>
      <p>Étoiles basées sur le <b>taux de transformation</b> (adhésions ÷ propositions).</p>
      <div class="lr"><span class="stars">★★★★★</span><b>Excellent</b>≥ 60 %</div>
      <div class="lr"><span class="stars">★★★★<span class="off">★</span></span><b>Très bien</b>45 – 59 %</div>
      <div class="lr"><span class="stars">★★★<span class="off">★★</span></span><b>Bien</b>30 – 44 %</div>
      <div class="lr"><span class="stars">★★<span class="off">★★★</span></span><b>À améliorer</b>15 – 29 %</div>
      <div class="lr"><span class="stars">★<span class="off">★★★★</span></span><b>Vigilance</b>&lt; 15 %</div>
    </div>`;
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.goto)));
}

/* ---------- CONSEILLER PAGE ---------- */
function renderConseiller(i){
  const c=state.conseillers[i],s=stats(c);
  let rows=c.contacts.map((x,j)=>`
    <tr data-j="${j}">
      <td><input class="txt" value="${esc(x.adh)}" data-f="adh" placeholder="N°"></td>
      <td><select data-f="origine"><option value="">—</option>
        ${ORIGINES.map(o=>`<option ${o===x.origine?'selected':''}>${o}</option>`).join('')}
        ${x.origine&&!ORIGINES.includes(x.origine)?`<option selected>${esc(x.origine)}</option>`:''}</select></td>
      <td><input type="date" value="${esc(x.date)}" data-f="date"></td>
      <td><select data-f="rdv"><option value="1"${x.rdv?' selected':''}>Oui</option><option value="0"${!x.rdv?' selected':''}>Non</option></select></td>
      <td class="num"><input type="number" min="0" value="${+x.propos||0}" data-f="propos"></td>
      <td class="num"><input type="number" min="0" value="${+x.adh_nb||0}" data-f="adh_nb"></td>
      <td><input type="checkbox" class="chk" ${x.relance?'checked':''} data-f="relance"></td>
      <td><button class="del" data-del="${j}">✕</button></td>
    </tr>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="page-head">
      <div class="big-av">${initials(c.name)}</div><h2>${esc(c.name)}</h2>
      <span class="sp"></span>
      <button class="mini" id="renameC">✎ Renommer</button>
      <button class="mini" id="delC">🗑 Supprimer</button>
    </div>
    <div class="cards">
      <div class="c"><div class="lbl">Contacts</div><div class="val">${s.contacts}</div></div>
      <div class="c"><div class="lbl">RDV honorés</div><div class="val">${s.rdv}</div></div>
      <div class="c"><div class="lbl">Propositions</div><div class="val">${s.propos}</div></div>
      <div class="c"><div class="lbl">Adhésions</div><div class="val">${s.adh}</div></div>
      <div class="c"><div class="lbl">Taux transfo.</div><div class="val">${s.taux}%</div><div class="sub stars">${starStr(stars(s.taux))}</div></div>
    </div>
    <div class="panel scroll"><table>
      <thead><tr><th>N° adhérent</th><th>Origine du contact</th><th>Date</th><th>RDV honoré</th>
        <th>Propositions</th><th>Adhésions</th><th>Relance</th><th></th></tr></thead>
      <tbody id="entryRows">
        ${rows||''}
        <tr class="addrow"><td colspan="8"><button class="btn" id="addContact">+ Ajouter un contact</button></td></tr>
      </tbody>
    </table></div>`;
  document.getElementById('renameC').addEventListener('click',()=>{const n=prompt('Renommer :',c.name);if(n&&n.trim()){c.name=n.trim();save();renderNav();render();}});
  document.getElementById('delC').addEventListener('click',()=>{if(confirm('Supprimer '+c.name+' et toutes ses saisies ?')){state.conseillers.splice(i,1);save();go('dash');}});
  bindEntry(i);
}
function bindEntry(i){
  const c=state.conseillers[i],tb=document.getElementById('entryRows');
  tb.addEventListener('click',e=>{
    if(e.target.id==='addContact'){c.contacts.push(newContact());save();renderConseiller(i);return;}
    const d=e.target.dataset.del;if(d!=null){c.contacts.splice(+d,1);save();renderConseiller(i);}
  });
  tb.addEventListener('change',e=>{
    const tr=e.target.closest('tr[data-j]');if(!tr)return;
    const x=c.contacts[+tr.dataset.j],f=e.target.dataset.f;
    if(f==='relance')x[f]=e.target.checked;
    else if(f==='rdv')x[f]=e.target.value==='1';
    else if(f==='propos'||f==='adh_nb')x[f]=Math.max(0,+e.target.value||0);
    else x[f]=e.target.value;
    save();refreshCards(i);
  });
  tb.addEventListener('input',e=>{
    if(e.target.dataset.f==='adh'){const tr=e.target.closest('tr[data-j]');c.contacts[+tr.dataset.j].adh=e.target.value;save();}
  });
}
function refreshCards(i){
  const s=stats(state.conseillers[i]),vals=document.querySelectorAll('.cards .c .val');
  if(vals.length>=5){vals[0].textContent=s.contacts;vals[1].textContent=s.rdv;vals[2].textContent=s.propos;vals[3].textContent=s.adh;vals[4].textContent=s.taux+'%';
    document.querySelector('.cards .c:last-child .sub').innerHTML=starStr(stars(s.taux));}
}

/* ---------- sidebar toggle (mobile) ---------- */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('backdrop').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');}
document.getElementById('burger').addEventListener('click',openSidebar);
document.getElementById('backdrop').addEventListener('click',closeSidebar);

/* nav clicks */
document.getElementById('sidebar').addEventListener('click',e=>{
  const it=e.target.closest('[data-route]');
  if(it){const r=it.dataset.route;go(r==='dash'?'dash':+r);return;}
  if(e.target.id==='navAdd'){const n=prompt('Nom du conseiller ?');if(n&&n.trim()){state.conseillers.push({name:n.trim(),contacts:[]});save();go(state.conseillers.length-1);}}
});

renderNav();render();
</script>
</body>
</html>
