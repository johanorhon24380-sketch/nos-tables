<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Conseillers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:#00953b;--green-d:#007a30;--green-dd:#00612a;--green-l:#e9f6ee;--green-xl:#f4fbf6;
    --os:#00953b;--os-l:#e5f4ea;--prev:#2f6fb0;--prev-l:#e7eff8;--oa:#dd8a12;--oa-l:#fbf1dc;
    --ink:#1b2a21;--muted:#6a7a70;--bg:#f3f7f4;--card:#fff;--border:#e2ece6;
    --amber:#e0a81e;--ko:#d25151;
    --sh:0 2px 12px rgba(0,70,30,.06);--sh-h:0 10px 30px rgba(0,70,30,.13);
  }
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:262px;background:linear-gradient(180deg,var(--green),var(--green-dd));color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;z-index:40;transition:transform .25s;}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;}
  .brand .logo{width:40px;height:40px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);font-size:1.15rem;flex-shrink:0;}
  .brand b{display:block;font-size:1.04rem;font-weight:800;line-height:1.1;}
  .brand span{font-size:.72rem;opacity:.75;}
  .nav-lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;opacity:.55;margin:16px 10px 6px;font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;font-size:.92rem;font-weight:500;color:rgba(255,255,255,.9);margin-bottom:2px;transition:background .15s;}
  .nav-item:hover{background:rgba(255,255,255,.13);}
  .nav-item.active{background:#fff;color:var(--green-d);font-weight:700;box-shadow:var(--sh);}
  .nav-item .ic{width:22px;text-align:center;font-size:1rem;flex-shrink:0;}
  .nav-item .av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;}
  .nav-item.active .av{background:var(--green-l);color:var(--green-d);}
  .nav-add{margin-top:4px;border:1px dashed rgba(255,255,255,.4);justify-content:center;font-size:.85rem;}
  .side-foot{margin-top:auto;font-size:.7rem;opacity:.6;padding:14px 10px 4px;line-height:1.5;}

  /* MAIN */
  .main{flex:1;margin-left:262px;min-width:0;}
  .topbar{display:none;align-items:center;gap:12px;background:var(--green);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;}
  .burger{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:1.2rem;width:38px;height:38px;border-radius:9px;cursor:pointer;}
  .content{padding:26px 30px 80px;max-width:1120px;margin:0 auto;}

  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  .page-head .big-av{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0;}
  .sp{flex:1;}
  .mini{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 13px;font-size:.83rem;font-weight:600;cursor:pointer;color:var(--muted);}
  .mini:hover{border-color:var(--green);color:var(--green-d);}
  .period{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:.85rem;color:var(--muted);}
  .period select{border:1px solid var(--border);border-radius:9px;padding:8px 12px;font-family:inherit;font-size:.86rem;background:var(--card);color:var(--ink);font-weight:600;outline:none;}
  .period select:focus{border-color:var(--green);}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .c{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);}
  .c .lbl{font-size:.71rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
  .c .val{font-size:1.9rem;font-weight:800;color:var(--green-d);margin-top:5px;line-height:1;}
  .c .sub{font-size:.72rem;color:var(--muted);margin-top:4px;}
  .c.blue .val{color:var(--prev);} .c.amber .val{color:var(--oa);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.87rem;}
  th,td{padding:11px 10px;text-align:center;border-bottom:1px solid #eef4f0;white-space:nowrap;}
  th{background:var(--green-xl);color:var(--green-dd);font-weight:700;font-size:.73rem;text-transform:uppercase;letter-spacing:.02em;}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);}
  th:first-child{background:var(--green-xl);}
  tbody tr:hover td{background:var(--green-xl);}
  tbody tr:hover td:first-child{background:var(--green-xl);}
  tr:last-child td{border-bottom:none;}
  tfoot td{background:var(--green-l)!important;font-weight:800;color:var(--green-dd);border-bottom:none;}
  .grp-os{color:var(--os);} .grp-prev{color:var(--prev);} .grp-oa{color:var(--oa);}
  .stars{color:var(--amber);letter-spacing:1px;white-space:nowrap;}
  .stars .off{color:#dfe7e2;}
  .rowname{cursor:pointer;color:var(--green-d);font-weight:700;}
  .rowname:hover{text-decoration:underline;}

  /* CONTACT CARDS (saisie) */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .btn{background:var(--green);color:#fff;border:none;border-radius:10px;padding:11px 17px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--green-d);}
  .contact{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);padding:16px;margin-bottom:14px;}
  .contact.honore-non{border-left:4px solid var(--ko);}
  .contact.honore-oui{border-left:4px solid var(--green);}
  .frow{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 1.1fr 1fr .8fr auto;gap:10px;align-items:end;}
  .field{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;}
  .field input,.field select{border:1px solid var(--border);border-radius:9px;padding:9px 9px;font-family:inherit;font-size:.87rem;background:#fff;color:var(--ink);outline:none;width:100%;}
  .field input:focus,.field select:focus{border-color:var(--green);}
  .del{background:transparent;border:1px solid var(--border);border-radius:9px;color:#c4d0c8;cursor:pointer;font-size:.95rem;height:38px;width:38px;flex-shrink:0;}
  .del:hover{color:var(--ko);border-color:#f0c9c9;}

  .offers{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);}
  .offers .oline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .offers .otag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;min-width:96px;color:var(--muted);}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:50px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:default;border:1px solid transparent;}
  .chip .x{cursor:pointer;opacity:.6;font-weight:700;}
  .chip .x:hover{opacity:1;}
  .chip.os{background:var(--os-l);color:var(--os);} .chip.prev{background:var(--prev-l);color:var(--prev);} .chip.oa{background:var(--oa-l);color:var(--oa);}
  .addoffer{border:1px dashed var(--border);background:#fff;border-radius:50px;padding:5px 12px;font-size:.8rem;font-weight:600;color:var(--green-d);cursor:pointer;}
  .addoffer:hover{border-color:var(--green);}
  .offer-panel{margin-top:10px;background:var(--green-xl);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .offer-grp{margin-bottom:8px;}
  .offer-grp:last-child{margin-bottom:0;}
  .offer-grp .gh{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .offer-grp.os .gh{color:var(--os);} .offer-grp.prev .gh{color:var(--prev);} .offer-grp.oa .gh{color:var(--oa);}
  .obtn{display:inline-block;background:#fff;border:1px solid var(--border);border-radius:50px;padding:5px 11px;font-size:.79rem;font-weight:600;margin:0 5px 5px 0;cursor:pointer;color:var(--ink);}
  .obtn:hover{border-color:var(--green);background:var(--green-l);}
  .details-toggle{margin-top:12px;font-size:.8rem;color:var(--green-d);cursor:pointer;font-weight:600;user-select:none;}
  .details-box{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  .empty{padding:34px;text-align:center;color:var(--muted);}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;}

  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:var(--sh-h);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:16px 14px 60px;}
    .backdrop.show{display:block;}
    .frow{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">M</div><div><b>Suivi Conseillers</b><span>MGEN — TDB Collectif 2026</span></div></div>
    <div class="nav-item" data-route="dash"><span class="ic">📊</span> Tableau de bord</div>
    <div class="nav-item" data-route="result"><span class="ic">📈</span> Suivi de résultat</div>
    <div class="nav-lbl">Conseillers</div>
    <div id="navConseillers"></div>
    <div class="nav-item nav-add" id="navAdd">+ Ajouter un conseiller</div>
    <div class="side-foot">Données enregistrées automatiquement sur ce poste.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <div class="topbar"><button class="burger" id="burger">☰</button><b id="topTitle">Tableau de bord</b></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";
const KEY='suiviConseillers_v4';

/* ---- référentiels (extraits du fichier Excel) ---- */
const ORIGINES=['Actions extérieures','Actions locales','Affaires CRM','Appel PSC','Appel entrant autre','Atelier','Campagne','Campagne reversement','Passeur','Rebond Accueil','Receveur','Recommandation','Relance tel perso','WEB service'];
const SUITES=['RDV Face à face','RDV Téléphonique','RDV Visio','Adhésion directe'];
const CATS=[{k:'os',label:'Santé'},{k:'prev',label:'Prévoyance'},{k:'oa',label:'Offres associées'}];
const OFFERS_PROPOS={
  os:['MSP','OJI','Efficience','Efficience FPH','MSPH','Santé CO'],
  prev:['Prev CO','Prev indiv','Mutex DC'],
  oa:['PJ','Epargne vie','PER en points','PER multi','CAM','Neobsia','Ass emp','santé animal','Reversement EV','Reversement RET']
};
const OFFERS_ADHES={
  os:['MSP','OJI','Efficience','Efficience FPH','MSPH','Santé CO'],
  prev:['Prev CO maintien','Prev CO conquête','Prev INDIV maintien','Prev INDIV conquête','Mutex DC'],
  oa:['PJ','Epargne vie','EV versement OK','PER pts','PER pts versement OK','PER multi','PER multi versement OK','CAM','Neobsia','Ass emp','Ass emp SUBSTIT','santé animal','Reversement EV','Reversement RET']
};
function catOf(offer,set){for(const k of ['os','prev','oa'])if(set[k].includes(offer))return k;return 'oa';}

let state=load();
let route='dash';
let period='all';

function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return demoState();
}
function ex(o){return Object.assign(newContact(),o);}  // contact d'exemple
function demoState(){
  return{conseillers:[
    {name:'Judicaël',contacts:[
      ex({nom:'Bernard Alice',numero:'0104558821',origine:'Campagne',suite:'RDV Visio',date:'2026-09-06',honore:'OUI',propos:['Santé CO','Mutex DC'],adhes:['Santé CO','Mutex DC']}),
      ex({nom:'Faure Thomas',numero:'0105123998',origine:'Receveur',suite:'RDV Face à face',date:'2026-09-09',honore:'OUI',propos:['MSP','PJ','Epargne vie'],adhes:['MSP']}),
    ]},
    {name:'Stéphane',contacts:[
      ex({nom:'Durand Sophie',numero:'0103447712',origine:'Receveur',suite:'RDV Face à face',date:'2026-09-03',honore:'OUI',propos:['MSP','PJ'],adhes:['MSP']}),
      ex({nom:'Petit Luc',numero:'0102889654',origine:'Passeur',suite:'RDV Face à face',date:'2026-09-04',honore:'OUI',propos:['Efficience','Prev CO'],adhes:['Efficience']}),
      ex({nom:'Girard Emma',numero:'0106552310',origine:'Recommandation',suite:'RDV Téléphonique',date:'2026-09-08',honore:'NON'}),
    ]},
    {name:'Johan',contacts:[
      ex({nom:'Descoubes Marielle',numero:'0101465524',origine:'Appel entrant autre',suite:'RDV Face à face',date:'2026-09-01',honore:'OUI',propos:['Santé CO'],adhes:['Santé CO']}),
      ex({nom:'Vanwambeke Jolan',numero:'0106295583',origine:'Campagne',suite:'RDV Visio',date:'2026-09-02',honore:'OUI',propos:['Prev indiv','PJ','PER en points','Epargne vie'],adhes:['Prev INDIV conquête','PJ']}),
      ex({nom:'Martin Paul',numero:'0102223344',origine:'Recommandation',suite:'RDV Téléphonique',date:'2026-09-05',honore:'NON'}),
    ]},
    {name:'Justine',contacts:[
      ex({nom:'Robert Marc',numero:'0107784412',origine:'WEB service',suite:'Adhésion directe',date:'2026-09-07',honore:'OUI',propos:['MSPH'],adhes:['MSPH']}),
    ]},
    {name:'Conseiller5',contacts:[]},
  ]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function stars(t){return t>=60?5:t>=45?4:t>=30?3:t>=15?2:1;}
function starStr(n){let s='';for(let i=1;i<=5;i++)s+=i<=n?'★':'<span class="off">★</span>';return s;}
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';}
function newContact(){return{nom:'',numero:'',origine:'',suite:'',date:'',honore:'OUI',propos:[],adhes:[],reco:'',dateRdv2:'',dateRelance:'',dateSignature:'',commentaire:'',_open:false};}
function ymd(d){return d?d.slice(0,7):'';}

/* ---- collecte des mois présents ---- */
function allMonths(){
  const set=new Set();
  state.conseillers.forEach(c=>c.contacts.forEach(x=>{if(x.date)set.add(ymd(x.date));}));
  return[...set].sort().reverse();
}
function inPeriod(x){return period==='all'||ymd(x.date)===period;}
function monthLabel(m){const[y,mo]=m.split('-');return['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][+mo-1]+' '+y;}

/* ---- stats ---- */
function stats(c){
  const s={rdv:0,honore:0,nonHonore:0,relance:0,
    propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  c.contacts.filter(inPeriod).forEach(x=>{
    s.rdv++;
    if(x.honore==='NON')s.nonHonore++;else s.honore++;
    if(x.dateRelance)s.relance++;
    x.propos.forEach(o=>{const k=catOf(o,OFFERS_PROPOS);s.propos[k]++;s.propos.total++;});
    x.adhes.forEach(o=>{const k=catOf(o,OFFERS_ADHES);s.ba[k]++;s.ba.total++;});
  });
  s.taux=pct(s.ba.total,s.propos.total);
  s.txHonore=pct(s.honore,s.rdv);
  return s;
}
function teamStats(){
  const T={rdv:0,honore:0,nonHonore:0,relance:0,propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  state.conseillers.forEach(c=>{const s=stats(c);T.rdv+=s.rdv;T.honore+=s.honore;T.nonHonore+=s.nonHonore;T.relance+=s.relance;
    ['os','prev','oa','total'].forEach(k=>{T.propos[k]+=s.propos[k];T.ba[k]+=s.ba[k];});});
  T.taux=pct(T.ba.total,T.propos.total);T.txHonore=pct(T.honore,T.rdv);
  return T;
}

/* ---- navigation ---- */
function renderNav(){
  document.getElementById('navConseillers').innerHTML=state.conseillers.map((c,i)=>
    `<div class="nav-item ${route===i?'active':''}" data-route="${i}"><span class="av">${initials(c.name)}</span>${esc(c.name)}</div>`).join('');
  document.querySelectorAll('.nav-item[data-route="dash"],.nav-item[data-route="result"]').forEach(el=>el.classList.toggle('active',el.dataset.route===route));
}
function periodSelect(){
  const ms=allMonths();
  return `<div class="period">📅 Période :
    <select id="periodSel"><option value="all"${period==='all'?' selected':''}>Toute l'année</option>
    ${ms.map(m=>`<option value="${m}"${period===m?' selected':''}>${monthLabel(m)}</option>`).join('')}</select></div>`;
}
function go(r){route=r;renderNav();render();closeSidebar();}
function render(){
  document.getElementById('topTitle').textContent=route==='dash'?'Tableau de bord':route==='result'?'Suivi de résultat':state.conseillers[route].name;
  if(route==='dash')renderDash();
  else if(route==='result')renderResult();
  else renderConseiller(route);
  const ps=document.getElementById('periodSel');
  if(ps)ps.addEventListener('change',()=>{period=ps.value;render();});
}

/* ---- TABLEAU DE BORD ---- */
function renderDash(){
  const T=teamStats();
  const rows=state.conseillers.map((c,i)=>{const s=stats(c);
    return `<tr><td><span class="rowname" data-goto="${i}">${esc(c.name)}</span></td>
      <td>${s.rdv}</td><td>${s.honore}</td><td>${s.txHonore}%</td>
      <td>${s.propos.total}</td><td>${s.ba.total}</td><td>${s.relance}</td>
      <td><b>${s.taux}%</b></td><td class="stars">${starStr(stars(s.taux))}</td></tr>`;}).join('');
  document.getElementById('content').innerHTML=`
    <div class="page-head"><h2>📊 Tableau de bord</h2></div>
    ${periodSelect()}
    <div class="cards">
      <div class="c"><div class="lbl">RDV honorés</div><div class="val">${T.honore}</div><div class="sub">sur ${T.rdv} pris · ${T.txHonore}%</div></div>
      <div class="c blue"><div class="lbl">Propositions</div><div class="val">${T.propos.total}</div></div>
      <div class="c amber"><div class="lbl">Adhésions (BA)</div><div class="val">${T.ba.total}</div></div>
      <div class="c"><div class="lbl">Relances</div><div class="val">${T.relance}</div></div>
      <div class="c"><div class="lbl">Taux de transfo.</div><div class="val">${T.taux}%</div><div class="sub">adhésions ÷ propositions</div></div>
    </div>
    <div class="panel scroll"><table>
      <thead><tr><th>Conseiller</th><th>RDV pris</th><th>Honorés</th><th>% hon.</th>
        <th>Propos.</th><th>Adhés.</th><th>Relances</th><th>Transfo</th><th>Note</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="empty">Aucun conseiller.</td></tr>'}</tbody>
      <tfoot><tr><td>Total équipe</td><td>${T.rdv}</td><td>${T.honore}</td><td>${T.txHonore}%</td>
        <td>${T.propos.total}</td><td>${T.ba.total}</td><td>${T.relance}</td><td>${T.taux}%</td><td></td></tr></tfoot>
    </table></div>
    <div class="panel" style="margin-top:20px;padding:16px 18px;">
      <b style="font-size:.95rem;">⭐ Note = taux de transformation</b>
      <div style="color:var(--muted);font-size:.83rem;margin-top:6px;">★★★★★ ≥60% · ★★★★ 45-59% · ★★★ 30-44% · ★★ 15-29% · ★ &lt;15%</div>
    </div>`;
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.goto)));
}

/* ---- SUIVI DE RÉSULTAT ---- */
function renderResult(){
  const T=teamStats();
  const row=(name,s,goto)=>`<tr>
    <td>${goto!=null?`<span class="rowname" data-goto="${goto}">${esc(name)}</span>`:esc(name)}</td>
    <td>${s.rdv}</td><td>${s.honore}</td><td>${s.nonHonore}</td><td>${s.txHonore}%</td>
    <td class="grp-os">${s.propos.os}</td><td class="grp-prev">${s.propos.prev}</td><td class="grp-oa">${s.propos.oa}</td><td><b>${s.propos.total}</b></td>
    <td class="grp-os">${s.ba.os}</td><td class="grp-prev">${s.ba.prev}</td><td class="grp-oa">${s.ba.oa}</td><td><b>${s.ba.total}</b></td>
    <td><b>${s.taux}%</b></td></tr>`;
  const rows=state.conseillers.map((c,i)=>row(c.name,stats(c),i)).join('');
  document.getElementById('content').innerHTML=`
    <div class="page-head"><h2>📈 Suivi de résultat</h2></div>
    ${periodSelect()}
    <div class="cards">
      <div class="c"><div class="lbl">RDV pris</div><div class="val">${T.rdv}</div><div class="sub">${T.honore} honorés · ${T.nonHonore} non</div></div>
      <div class="c blue"><div class="lbl">Propositions</div><div class="val">${T.propos.total}</div><div class="sub">S ${T.propos.os} · P ${T.propos.prev} · A ${T.propos.oa}</div></div>
      <div class="c amber"><div class="lbl">Adhésions (BA)</div><div class="val">${T.ba.total}</div><div class="sub">S ${T.ba.os} · P ${T.ba.prev} · A ${T.ba.oa}</div></div>
      <div class="c"><div class="lbl">Taux transfo.</div><div class="val">${T.taux}%</div></div>
    </div>
    <div class="panel scroll"><table>
      <thead>
        <tr><th rowspan="2">Conseiller</th><th colspan="4">RDV</th><th colspan="4">Propositions</th><th colspan="4">Adhésions (BA)</th><th rowspan="2">Transfo</th></tr>
        <tr><th>Pris</th><th>Hon.</th><th>Non</th><th>%</th>
            <th class="grp-os">Santé</th><th class="grp-prev">Prév</th><th class="grp-oa">Assoc</th><th>Tot</th>
            <th class="grp-os">Santé</th><th class="grp-prev">Prév</th><th class="grp-oa">Assoc</th><th>Tot</th></tr>
      </thead>
      <tbody>${rows||'<tr><td colspan="14" class="empty">Aucune donnée.</td></tr>'}</tbody>
      <tfoot>${row('Total équipe',T,null)}</tfoot>
    </table></div>
    <p style="color:var(--muted);font-size:.8rem;margin-top:14px;">Santé = offres santé · Prév = prévoyance · Assoc = offres associées (PJ, épargne, PER, CAM…). BA = bonnes affaires (adhésions signées).</p>`;
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click',()=>go(+el.dataset.goto)));
}

/* ---- PAGE CONSEILLER (saisie) ---- */
function chip(o,kind,ci,j){const set=kind==='propos'?OFFERS_PROPOS:OFFERS_ADHES;const k=catOf(o,set);
  return `<span class="chip ${k}">${esc(o)}<span class="x" data-rm="${kind}" data-ci="${ci}" data-j="${j}" data-o="${esc(o)}">✕</span></span>`;}
function offerPanel(kind,ci,j){const set=kind==='propos'?OFFERS_PROPOS:OFFERS_ADHES;
  return `<div class="offer-panel" data-panel="${kind}-${j}" hidden>${CATS.map(c=>`
    <div class="offer-grp ${c.k}"><div class="gh">${c.label}</div>
      ${set[c.k].map(o=>`<span class="obtn" data-add="${kind}" data-ci="${ci}" data-j="${j}" data-o="${esc(o)}">+ ${esc(o)}</span>`).join('')}
    </div>`).join('')}</div>`;}
function offersBlock(x,kind,ci,j){const arr=kind==='propos'?x.propos:x.adhes;const tag=kind==='propos'?'Propositions':'Adhésions';
  return `<div class="offers"><div class="oline"><span class="otag">${tag}</span>
    ${arr.map(o=>chip(o,kind,ci,j)).join('')}
    ${arr.length<5?`<span class="addoffer" data-toggle="${kind}-${j}">+ offre</span>`:'<span style="font-size:.72rem;color:var(--muted);">(5 max)</span>'}
    </div>${offerPanel(kind,ci,j)}</div>`;}

function contactCard(x,ci,j){
  return `<div class="contact ${x.honore==='NON'?'honore-non':'honore-oui'}" data-card="${j}">
    <div class="frow">
      <div class="field"><label>Nom + prénom adhérent</label><input value="${esc(x.nom)}" data-f="nom" data-j="${j}" placeholder="Nom Prénom"></div>
      <div class="field"><label>N° adhérent</label><input value="${esc(x.numero)}" data-f="numero" data-j="${j}" placeholder="N°"></div>
      <div class="field"><label>Origine du contact</label><select data-f="origine" data-j="${j}"><option value="">—</option>${ORIGINES.map(o=>`<option ${o===x.origine?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Suite donnée</label><select data-f="suite" data-j="${j}"><option value="">—</option>${SUITES.map(o=>`<option ${o===x.suite?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" value="${esc(x.date)}" data-f="date" data-j="${j}"></div>
      <div class="field"><label>RDV honoré</label><select data-f="honore" data-j="${j}"><option ${x.honore==='OUI'?'selected':''}>OUI</option><option ${x.honore==='NON'?'selected':''}>NON</option></select></div>
      <button class="del" data-del="${j}" title="Supprimer">✕</button>
    </div>
    ${offersBlock(x,'propos',ci,j)}
    ${offersBlock(x,'adhes',ci,j)}
    <div class="details-toggle" data-details="${j}">${x._open?'▾ Masquer les détails':'▸ RECO, relance, commentaire…'}</div>
    ${x._open?`<div class="details-box">
      <div class="field"><label>RECO</label><input value="${esc(x.reco)}" data-f="reco" data-j="${j}"></div>
      <div class="field"><label>Date de RDV 2</label><input type="date" value="${esc(x.dateRdv2)}" data-f="dateRdv2" data-j="${j}"></div>
      <div class="field"><label>Date de relance</label><input type="date" value="${esc(x.dateRelance)}" data-f="dateRelance" data-j="${j}"></div>
      <div class="field"><label>Date signature (2 temps)</label><input type="date" value="${esc(x.dateSignature)}" data-f="dateSignature" data-j="${j}"></div>
      <div class="field" style="grid-column:1/-1;"><label>Commentaires</label><input value="${esc(x.commentaire)}" data-f="commentaire" data-j="${j}"></div>
    </div>`:''}
  </div>`;
}
function renderConseiller(i){
  const c=state.conseillers[i],s=stats(c);
  const list=c.contacts.map((x,j)=>({x,j})).filter(o=>inPeriod(o.x)).reverse();
  document.getElementById('content').innerHTML=`
    <div class="page-head"><div class="big-av">${initials(c.name)}</div><h2>${esc(c.name)}</h2>
      <span class="sp"></span>
      <button class="mini" id="renameC">✎ Renommer</button>
      <button class="mini" id="delC">🗑 Supprimer</button>
    </div>
    ${periodSelect()}
    <div class="cards">
      <div class="c"><div class="lbl">RDV pris</div><div class="val">${s.rdv}</div><div class="sub">${s.honore} honorés</div></div>
      <div class="c blue"><div class="lbl">Propositions</div><div class="val">${s.propos.total}</div></div>
      <div class="c amber"><div class="lbl">Adhésions</div><div class="val">${s.ba.total}</div></div>
      <div class="c"><div class="lbl">Taux transfo.</div><div class="val">${s.taux}%</div><div class="sub stars">${starStr(stars(s.taux))}</div></div>
    </div>
    <div class="toolbar"><button class="btn" id="addContact">+ Ajouter un contact</button></div>
    <div id="contacts">${list.length?list.map(o=>contactCard(o.x,i,o.j)).join(''):'<div class="panel empty">Aucun contact sur cette période. Cliquez sur « + Ajouter un contact ».</div>'}</div>`;
  document.getElementById('renameC').onclick=()=>{const n=prompt('Renommer :',c.name);if(n&&n.trim()){c.name=n.trim();save();renderNav();render();}};
  document.getElementById('delC').onclick=()=>{if(confirm('Supprimer '+c.name+' et toutes ses saisies ?')){state.conseillers.splice(i,1);save();go('dash');}};
  document.getElementById('addContact').onclick=()=>{c.contacts.push(newContact());save();renderConseiller(i);};
  bindContacts(i);
}
function refreshConseillerCards(i){
  const s=stats(state.conseillers[i]),v=document.querySelectorAll('.cards .c .val');
  if(v.length>=4){v[0].textContent=s.rdv;v[1].textContent=s.propos.total;v[2].textContent=s.ba.total;v[3].textContent=s.taux+'%';
    document.querySelector('.cards .c:last-child .sub').innerHTML=starStr(stars(s.taux));
    document.querySelector('.cards .c:first-child .sub').textContent=s.honore+' honorés';}
}
function bindContacts(i){
  const c=state.conseillers[i],box=document.getElementById('contacts');
  box.addEventListener('input',e=>{
    const f=e.target.dataset.f;if(!f)return;const j=+e.target.dataset.j;c.contacts[j][f]=e.target.value;save();
  });
  box.addEventListener('change',e=>{
    const f=e.target.dataset.f;if(!f)return;const j=+e.target.dataset.j;c.contacts[j][f]=e.target.value;save();
    if(f==='honore'){const card=e.target.closest('.contact');card.classList.toggle('honore-non',e.target.value==='NON');card.classList.toggle('honore-oui',e.target.value==='OUI');refreshConseillerCards(i);}
    if(f==='date')refreshConseillerCards(i);
  });
  box.addEventListener('click',e=>{
    const t=e.target;
    if(t.dataset.del!=null){c.contacts.splice(+t.dataset.del,1);save();renderConseiller(i);return;}
    if(t.dataset.details!=null){const j=+t.dataset.details;c.contacts[j]._open=!c.contacts[j]._open;save();renderConseiller(i);return;}
    if(t.dataset.toggle){const p=box.querySelector(`[data-panel="${t.dataset.toggle}"]`);if(p)p.hidden=!p.hidden;return;}
    if(t.dataset.add){const j=+t.dataset.ci===i?+t.dataset.j:+t.dataset.j;const kind=t.dataset.add,arr=kind==='propos'?c.contacts[j].propos:c.contacts[j].adhes;
      if(arr.length<5){arr.push(t.dataset.o);save();renderConseiller(i);refreshConseillerCards(i);}return;}
    if(t.dataset.rm){const j=+t.dataset.j,kind=t.dataset.rm,arr=kind==='propos'?c.contacts[j].propos:c.contacts[j].adhes,k=arr.indexOf(t.dataset.o);
      if(k>-1){arr.splice(k,1);save();renderConseiller(i);refreshConseillerCards(i);}return;}
  });
}

/* ---- sidebar mobile ---- */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('backdrop').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');}
document.getElementById('burger').onclick=openSidebar;
document.getElementById('backdrop').onclick=closeSidebar;
document.getElementById('sidebar').addEventListener('click',e=>{
  const it=e.target.closest('[data-route]');
  if(it){const r=it.dataset.route;go(r==='dash'||r==='result'?r:+r);return;}
  if(e.target.id==='navAdd'){const n=prompt('Nom du conseiller ?');if(n&&n.trim()){state.conseillers.push({name:n.trim(),contacts:[]});save();go(state.conseillers.length-1);}}
});

renderNav();render();
</script>
</body>
</html>
