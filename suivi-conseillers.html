<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Conseillers</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    color-scheme:light;
    --bg:#eef2f7;--panel:#ffffff;--card:#ffffff;--elev:#f4f7fb;
    --line:#e3e9f1;--line-2:#eef2f7;
    --fill:rgba(16,26,43,.04);--fill-2:rgba(16,26,43,.022);
    --text:#101a2b;--muted:#5a6a7e;--faint:#93a1b2;
    --accent:#0aa64f;--accent-2:#0891b2;--accent-ink:#067a3a;--accent-dim:rgba(10,166,79,.12);
    --os:#0f9d63;--prev:#2563eb;--oa:#d97706;--danger:#dc2626;--amber:#d99e06;
    --os-b:rgba(15,157,99,.12);--prev-b:rgba(37,99,235,.11);--oa-b:rgba(217,119,6,.13);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Sora',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
    --sh:0 1px 2px rgba(16,30,55,.04),0 10px 28px rgba(16,30,55,.06);
  }
  body{font-family:var(--body);color:var(--text);background:var(--bg);
    background-image:radial-gradient(1100px 560px at 12% -8%,rgba(10,166,79,.10),transparent 58%),
                     radial-gradient(900px 520px at 102% 2%,rgba(37,99,235,.06),transparent 55%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;}
  input,select,button{font-family:inherit;}
  ::selection{background:var(--accent-dim);}

  .app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR ===== */
  .sidebar{width:246px;position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;padding:20px 14px;
    background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;transition:transform .25s;}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;}
  .brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--accent),#067a3a);
    display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#fff;font-size:1.2rem;
    box-shadow:0 6px 18px rgba(10,166,79,.35);flex-shrink:0;}
  .brand b{display:block;font-family:var(--disp);font-size:1.02rem;font-weight:700;letter-spacing:-.01em;color:var(--text);}
  .brand span{font-size:.71rem;color:var(--muted);}
  .nav-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);margin:18px 12px 8px;font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:.9rem;font-weight:500;
    color:var(--muted);margin-bottom:3px;position:relative;transition:.16s;}
  .nav-item:hover{background:var(--fill);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:var(--accent-ink);font-weight:700;}
  .nav-item.active::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
    background:var(--accent);box-shadow:0 0 10px rgba(10,166,79,.6);}
  .nav-item .ic{width:20px;text-align:center;font-size:1rem;flex-shrink:0;opacity:.85;}
  .nav-item .av{width:27px;height:27px;border-radius:8px;background:var(--fill);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;font-family:var(--mono);flex-shrink:0;color:var(--muted);}
  .nav-item.active .av{background:var(--accent);color:#fff;border-color:transparent;}
  .nav-add{margin-top:6px;border:1px dashed var(--line);justify-content:center;font-size:.83rem;color:var(--accent-ink);}
  .nav-add:hover{border-color:var(--accent);background:var(--accent-dim);}
  .side-foot{margin-top:auto;font-size:.68rem;color:var(--faint);padding:16px 10px 4px;line-height:1.6;}

  /* ===== MAIN ===== */
  .main{flex:1;margin-left:246px;min-width:0;}
  .topbar{display:none;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:30;
    background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .burger{background:var(--fill);border:1px solid var(--line);color:var(--text);font-size:1.15rem;width:40px;height:40px;border-radius:11px;cursor:pointer;}
  .content{padding:30px 34px 90px;max-width:1160px;margin:0 auto;}

  .page-head{display:flex;align-items:center;gap:15px;margin-bottom:8px;flex-wrap:wrap;}
  .page-head h2{font-family:var(--disp);font-size:1.6rem;font-weight:700;letter-spacing:-.025em;text-wrap:balance;}
  .page-head .eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;color:var(--accent-ink);font-weight:700;margin-bottom:2px;}
  .big-av{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#067a3a);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:1.15rem;
    box-shadow:0 6px 18px rgba(10,166,79,.3);flex-shrink:0;}
  .sp{flex:1;}
  .mini{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;box-shadow:var(--sh);}
  .mini:hover{border-color:var(--accent);color:var(--accent-ink);}
  .period{display:flex;align-items:center;gap:9px;margin:16px 0 22px;font-size:.82rem;color:var(--muted);}
  select,.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;font-size:.85rem;color:var(--text);outline:none;transition:.15s;}
  select:focus,.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  option{background:#fff;color:var(--text);}

  /* ===== SEARCH ===== */
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:11px 15px;margin-bottom:16px;box-shadow:var(--sh);max-width:440px;transition:.15s;}
  .searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .searchbar .si{color:var(--faint);font-size:.95rem;}
  .searchbar input{border:none;background:transparent;outline:none;font-size:.9rem;color:var(--text);width:100%;}
  .searchbar input::placeholder{color:var(--faint);}

  /* ===== KPI TILES ===== */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:16px;margin-bottom:24px;}
  .tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:18px 20px;background:var(--card);box-shadow:var(--sh);}
  .tile .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;}
  .tile .num{font-family:var(--mono);font-size:2.15rem;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums;}
  .tile .sub{font-size:.73rem;color:var(--faint);margin-top:7px;}
  .tile.accent{background:linear-gradient(160deg,var(--accent-dim),transparent);border-color:rgba(10,166,79,.35);}
  .tile.accent .num{color:var(--accent-ink);}
  .tile .flex{display:flex;align-items:center;gap:16px;}
  .tile.blue .num{color:var(--prev);} .tile.amber .num{color:var(--oa);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  .ring-txt{fill:var(--text);font-family:var(--mono);font-weight:700;}

  .stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--fill);margin-top:10px;}
  .stack span{display:block;height:100%;}
  .s-os{background:var(--os);} .s-prev{background:var(--prev);} .s-oa{background:var(--oa);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:12px;}
  .legend b{color:var(--text);font-family:var(--mono);}

  /* ===== PANELS / TABLES ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden;}
  .panel-h{padding:16px 20px;font-family:var(--disp);font-weight:600;font-size:.98rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  th,td{padding:13px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-2);}
  th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;background:var(--fill-2);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);}
  td{font-variant-numeric:tabular-nums;color:var(--text);}
  tbody tr{transition:background .15s;}
  tbody tr:hover td{background:var(--accent-dim);}
  tbody tr:hover td:first-child{background:#eafaf0;}
  tr:last-child td{border-bottom:none;}
  tfoot td{background:var(--accent-dim)!important;font-weight:700;color:var(--accent-ink);border-bottom:none;font-family:var(--mono);}
  .num-c{font-family:var(--mono);font-weight:600;}
  .grp-os{color:var(--os);} .grp-prev{color:var(--prev);} .grp-oa{color:var(--oa);}
  .rowname{cursor:pointer;color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:9px;}
  .rowname:hover{color:var(--accent-ink);}
  .ra{width:26px;height:26px;border-radius:8px;background:var(--fill);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;font-family:var(--mono);color:var(--muted);}
  .stars{color:var(--amber);letter-spacing:2px;}
  .stars .off{color:#d7dee6;}
  .tbar{width:74px;height:7px;border-radius:5px;background:var(--fill);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
  .tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px;}

  /* ===== matrice offre × conseiller ===== */
  .ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);}
  .seg{display:inline-flex;background:var(--fill);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;}
  .seg button{background:transparent;border:none;color:var(--muted);padding:8px 15px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s;}
  .seg button.on{background:#fff;color:var(--accent-ink);box-shadow:var(--sh);}
  .chkline{font-size:.79rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px;cursor:pointer;margin-left:6px;}
  .chkline input{accent-color:var(--accent);}
  .band td{background:var(--fill)!important;font-family:var(--disp);font-weight:600;font-size:.8rem;text-align:left!important;letter-spacing:.02em;color:var(--text);}
  .band .bdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:9px;vertical-align:middle;}
  .band.os .bdot{background:var(--os);}.band.prev .bdot{background:var(--prev);}.band.oa .bdot{background:var(--oa);}
  td.offcell{text-align:left!important;color:var(--text);font-weight:500;}
  td.z{color:var(--faint);}
  td.hot{color:var(--accent-ink);font-weight:700;}
  td.tot{color:var(--text);}
  tr.sub td{background:var(--fill-2);font-weight:700;color:var(--muted);font-family:var(--mono);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  tr.sub td:first-child{text-align:left;font-family:var(--disp);font-size:.8rem;background:var(--fill-2);}

  /* ===== SAISIE ===== */
  .toolbar{display:flex;gap:10px;margin:20px 0 16px;flex-wrap:wrap;}
  .btn{background:linear-gradient(145deg,var(--accent),#067a3a);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(10,166,79,.28);transition:.15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(10,166,79,.36);}
  .contact{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;transition:.15s;}
  .contact:hover{border-color:#cdd7e3;box-shadow:0 2px 6px rgba(16,30,55,.05),0 16px 36px rgba(16,30,55,.09);}
  .chead{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line-2);background:var(--fill-2);flex-wrap:wrap;}
  .cavatar{width:46px;height:46px;border-radius:13px;background:var(--accent-dim);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:1rem;flex-shrink:0;}
  .cwho{flex:1;min-width:150px;display:flex;flex-direction:column;gap:1px;}
  .cname{border:1px solid transparent;background:transparent;font-family:var(--disp);font-weight:700;font-size:1.05rem;color:var(--text);outline:none;padding:3px 6px;border-radius:8px;width:100%;transition:.12s;}
  .cname:hover{background:var(--fill);} .cname:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .cname::placeholder{color:var(--faint);font-weight:600;}
  .cnum{border:1px solid transparent;background:transparent;font-family:var(--mono);font-size:.8rem;color:var(--muted);outline:none;padding:2px 6px;border-radius:7px;width:100%;transition:.12s;}
  .cnum:hover{background:var(--fill);} .cnum:focus{background:#fff;border-color:var(--accent);}
  .cnum::placeholder{color:var(--faint);}
  .toggle{display:inline-flex;background:var(--fill);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-shrink:0;}
  .toggle .tg{border:none;background:transparent;color:var(--muted);font-size:.78rem;font-weight:700;padding:8px 13px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .toggle .tg.on.ok{background:var(--os);color:#fff;box-shadow:0 2px 8px rgba(15,157,99,.35);}
  .toggle .tg.on.no{background:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.3);}
  .cbody{padding:16px 18px 18px;}
  .cmeta{display:grid;grid-template-columns:1.3fr 1.3fr 1fr;gap:13px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;}
  .field input,.field select{width:100%;}
  .field input::placeholder{color:var(--faint);}
  .del{background:var(--fill);border:1px solid var(--line);border-radius:11px;color:var(--faint);cursor:pointer;font-size:.95rem;height:40px;width:40px;flex-shrink:0;transition:.15s;}
  .del:hover{color:var(--danger);border-color:rgba(220,38,38,.4);background:rgba(220,38,38,.06);}

  .ogroup{background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;}
  .ogroup.res{background:linear-gradient(150deg,var(--accent-dim),transparent 70%);border-color:rgba(10,166,79,.25);}
  .ohead{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .otitle{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .ocount{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--accent-ink);background:#fff;border:1px solid var(--line);border-radius:50px;padding:1px 9px;min-width:24px;text-align:center;}
  .oline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:50px;padding:6px 12px;font-size:.79rem;font-weight:600;border:1px solid transparent;}
  .chip .x{cursor:pointer;opacity:.55;font-weight:700;}
  .chip .x:hover{opacity:1;}
  .chip.os{background:var(--os-b);color:var(--os);border-color:rgba(15,157,99,.28);}
  .chip.prev{background:var(--prev-b);color:var(--prev);border-color:rgba(37,99,235,.28);}
  .chip.oa{background:var(--oa-b);color:var(--oa);border-color:rgba(217,119,6,.3);}
  .addoffer{border:1px dashed var(--line);background:var(--fill);border-radius:50px;padding:6px 13px;font-size:.79rem;font-weight:600;color:var(--accent-ink);cursor:pointer;transition:.15s;}
  .addoffer:hover{border-color:var(--accent);color:var(--accent-ink);}
  .cap{font-size:.7rem;color:var(--faint);}
  .offer-panel{margin-top:12px;background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .offer-grp{margin-bottom:10px;}
  .offer-grp:last-child{margin-bottom:0;}
  .offer-grp .gh{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
  .offer-grp.os .gh{color:var(--os);}.offer-grp.prev .gh{color:var(--prev);}.offer-grp.oa .gh{color:var(--oa);}
  .obtn{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:50px;padding:6px 12px;font-size:.78rem;font-weight:600;margin:0 6px 6px 0;cursor:pointer;color:var(--text);transition:.15s;}
  .obtn:hover{border-color:var(--accent);background:var(--accent-dim);}
  .details-toggle{margin-top:14px;font-size:.79rem;color:var(--accent-ink);cursor:pointer;font-weight:600;user-select:none;}
  .details-box{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(16,26,43,.4);z-index:35;}

  /* ===== dialogues integres ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(16,26,43,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 64px rgba(16,30,55,.28);padding:22px;max-width:420px;width:100%;}
  .modal h3{font-family:var(--disp);font-size:1.12rem;font-weight:700;margin-bottom:6px;}
  .modal p{color:var(--muted);font-size:.88rem;margin-bottom:14px;line-height:1.5;}
  .modal input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:.95rem;color:var(--text);background:var(--panel);outline:none;margin-bottom:16px;}
  .modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
  .modal .btn-cancel{background:var(--fill);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.88rem;}
  .modal .btn-cancel:hover{border-color:var(--muted);}
  .modal .btn-ok{background:linear-gradient(145deg,var(--accent),#067a3a);color:#fff;border:none;border-radius:11px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:.88rem;}
  .modal .btn-ok.danger{background:linear-gradient(145deg,#ef4444,#b91c1c);}

  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:0 0 60px rgba(16,26,43,.25);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:18px 15px 70px;}
    .backdrop.show{display:block;}
    .cmeta{grid-template-columns:1fr;}
    .chead{gap:10px;}
    .cwho{order:2;flex-basis:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">M</div><div><b>Suivi Conseillers</b><span>MGEN · TDB Collectif 2026</span></div></div>
    <div class="nav-item" data-route="dash"><span class="ic">◈</span> Tableau de bord</div>
    <div class="nav-item" data-route="result"><span class="ic">◔</span> Suivi de résultat</div>
    <div class="nav-lbl">Conseillers</div>
    <div id="navConseillers"></div>
    <div class="nav-item nav-add" id="navAdd">+ Ajouter un conseiller</div>
    <div class="side-foot">Données enregistrées automatiquement sur ce poste.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="modal-bg" id="modalBg"></div>
  <div class="main">
    <div class="topbar"><button class="burger" id="burger">☰</button><b id="topTitle">Tableau de bord</b></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";
const KEY='suiviConseillers_v4';

/* ===================== CONFIG FIREBASE =====================
   Colle ici la configuration de TON projet Firebase (Realtime Database).
   Tant que databaseURL n'est pas rempli, l'appli fonctionne en local (ce poste). */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",   // ex: https://suivi-conseillers-xxxx-default-rtdb.europe-west1.firebasedatabase.app
  projectId: "",

function modalText(title,message,value,okLabel){return new Promise(res=>{

  bg.classList.add('show');
  const inp=document.getElementById('modalInput');inp.focus();inp.select();
  const done=v=>{bg.classList.remove('show');bg.innerHTML='';res(v);};
  document.getElementById('mOk').onclick=()=>done(inp.value);

  inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);else if(e.key==='Escape')done(null);};
  bg.onclick=e=>{if(e.target===bg)done(null);};
});}
function modalConfirm(title,message,okLabel,danger){return new Promise(res=>{
  const bg=document.getElementById('modalBg');
  bg.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${message?`<p>${esc(message)}</p>`:''}

  bg.classList.add('show');

function allMonths(){const s=new Set();state.conseillers.forEach(c=>c.contacts.forEach(x=>{if(x.date)s.add(ymd(x.date));}));return[...s].sort().reverse();}
function inPeriod(x){return period==='all'||ymd(x.date)===period;}
function monthLabel(m){const[y,mo]=m.split('-');return['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][+mo-1]+' '+y;}

function stats(c){const s={rdv:0,honore:0,nonHonore:0,relance:0,propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  c.contacts.filter(inPeriod).forEach(x=>{s.rdv++;if(x.honore==='NON')s.nonHonore++;else s.honore++;if(x.dateRelance)s.relance++;
    x.propos.forEach(o=>{const k=catOf(o,OFFERS_PROPOS);s.propos[k]++;s.propos.total++;});
    x.adhes.forEach(o=>{const k=catOf(o,OFFERS_ADHES);s.ba[k]++;s.ba.total++;});});
  s.taux=pct(s.ba.total,s.propos.total);s.txHonore=pct(s.honore,s.rdv);return s;}
function teamStats(){const T={rdv:0,honore:0,nonHonore:0,relance:0,propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  state.conseillers.forEach(c=>{const s=stats(c);T.rdv+=s.rdv;T.honore+=s.honore;T.nonHonore+=s.nonHonore;T.relance+=s.relance;
    ['os','prev','oa','total'].forEach(k=>{T.propos[k]+=s.propos[k];T.ba[k]+=s.ba[k];});});
  T.taux=pct(T.ba.total,T.propos.total);T.txHonore=pct(T.honore,T.rdv);return T;}

/* progress ring */
function ring(p,size=76,stroke=8,color='var(--accent)'){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(p,100)/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"
      style="filter:drop-shadow(0 0 5px ${color})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-txt" font-size="${size*0.26}">${p}%</text></svg>`;
}
function stack(o,p,a){const t=o+p+a||1;return `<div class="stack"><span class="s-os" style="width:${o/t*100}%"></span><span class="s-prev" style="width:${p/t*100}%"></span><span class="s-oa" style="width:${a/t*100}%"></span></div>`;}
function catLegend(s){return `<div class="legend">
  <span><span class="dot" style="background:var(--os)"></span>Santé <b>${s.os}</b></span>
  <span><span class="dot" style="background:var(--prev)"></span>Prévoyance <b>${s.prev}</b></span>
  <span><span class="dot" style="background:var(--oa)"></span>Add. <b>${s.oa}</b></span></div>`;}

function matrixHTML(kind){
  const offersSet=kind==='propos'?OFFERS_PROPOS:OFFERS_ADHES;
  const cons=state.conseillers;
  const counts=cons.map(c=>{const m={};c.contacts.filter(inPeriod).forEach(x=>{(kind==='propos'?x.propos:x.adhes).forEach(o=>m[o]=(m[o]||0)+1);});return m;});
  const colTot=cons.map(()=>0);let grand=0,body='';
  CATS.forEach(cat=>{
    let rowsHtml='';const catCol=cons.map(()=>0);let catSum=0;
    offersSet[cat.k].forEach(o=>{
      const per=counts.map(m=>m[o]||0),tot=per.reduce((a,b)=>a+b,0);
      if(resHideZero&&tot===0)return;
      per.forEach((v,ci)=>{catCol[ci]+=v;colTot[ci]+=v;});catSum+=tot;grand+=tot;
      rowsHtml+=`<tr><td class="offcell">${esc(o)}</td>${per.map(v=>`<td class="${v?'num-c hot':'z'}">${v||'·'}</td>`).join('')}<td class="num-c tot">${tot||'·'}</td></tr>`;
    });
    body+=`<tr class="band ${cat.k}"><td colspan="${cons.length+2}"><span class="bdot"></span>${cat.label}</td></tr>`;
    body+=rowsHtml||`<tr><td class="offcell z">— aucune —</td>${cons.map(()=>'<td class="z">·</td>').join('')}<td class="z">·</td></tr>`;
    body+=`<tr class="sub"><td>Sous-total ${cat.label}</td>${catCol.map(v=>`<td>${v}</td>`).join('')}<td>${catSum}</td></tr>`;
  });
  const head=`<tr><th>Offre</th>${cons.map(c=>`<th>${esc(c.name)}</th>`).join('')}<th>Total</th></tr>`;
  const foot=`<tr><td>Total ${kind==='propos'?'propositions':'adhésions'}</td>${colTot.map(v=>`<td>${v}</td>`).join('')}<td>${grand}</td></tr>`;
  return `<table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
}

      </div>
      <div class="toggle">
        <button class="tg ${x.honore!=='NON'?'on ok':''}" data-hon="OUI" data-j="${j}">✓ Honoré</button>
        <button class="tg ${x.honore==='NON'?'on no':''}" data-hon="NON" data-j="${j}">✕ Non honoré</button>
      </div>
      <button class="del" data-del="${j}" title="Supprimer">🗑</button>
    </div>
    <div class="cbody">
      <div class="cmeta">
        <div class="field"><label>Origine du contact</label><select data-f="origine" data-j="${j}"><option value="">—</option>${ORIGINES.map(o=>`<option ${o===x.origine?'selected':''}>${o}</option>`).join('')}</select></div>
        <div class="field"><label>Type de RDV / suite</label><select data-f="suite" data-j="${j}"><option value="">—</option>${SUITES.map(o=>`<option ${o===x.suite?'selected':''}>${o}</option>`).join('')}</select></div>
        <div class="field"><label>Date</label><input type="date" value="${esc(x.date)}" data-f="date" data-j="${j}"></div>
      </div>
      ${offersBlock(x,'propos',ci,j)}${offersBlock(x,'adhes',ci,j)}
      <div class="details-toggle" data-details="${j}">${x._open?'▾ Masquer les détails':'▸ RECO, relance, commentaire…'}</div>
    ${x._open?`<div class="details-box">
      <div class="field"><label>RECO</label><input value="${esc(x.reco)}" data-f="reco" data-j="${j}"></div>
      <div class="field"><label>Date de RDV 2</label><input type="date" value="${esc(x.dateRdv2)}" data-f="dateRdv2" data-j="${j}"></div>
      <div class="field"><label>Date de relance</label><input type="date" value="${esc(x.dateRelance)}" data-f="dateRelance" data-j="${j}"></div>
      <div class="field"><label>Date signature (2 temps)</label><input type="date" value="${esc(x.dateSignature)}" data-f="dateSignature" data-j="${j}"></div>
      <div class="field" style="grid-column:1/-1;"><label>Commentaires</label><input value="${esc(x.commentaire)}" data-f="commentaire" data-j="${j}"></div>
    </div>`:''}</div></div>`;}
function renderConseiller(c){
  if(!c)return renderDash();
  const s=stats(c);
  const list=c.contacts.map((x,j)=>({x,j})).filter(o=>inPeriod(o.x)).reverse();
  document.getElementById('content').innerHTML=`
    <div class="page-head"><div class="big-av">${initials(c.name)}</div>
      <div><div class="eyebrow">Fiche conseiller</div><h2>${esc(c.name)}</h2></div>
      <span class="sp"></span><button class="mini" id="renameC">✎ Renommer</button><button class="mini" id="delC">🗑 Supprimer</button></div>
    ${periodSelect()}
    <div class="tiles">
      <div class="tile accent"><div class="flex">${ring(s.taux)}<div><div class="lbl">Taux de transfo</div><div class="sub">${starStr(stars(s.taux))}</div></div></div></div>
      <div class="tile"><div class="lbl">RDV pris</div><div class="num">${s.rdv}</div><div class="sub">${s.honore} honorés · ${s.txHonore}%</div></div>
      <div class="tile blue"><div class="lbl">Propositions</div><div class="num">${s.propos.total}</div>${stack(s.propos.os,s.propos.prev,s.propos.oa)}</div>
      <div class="tile amber"><div class="lbl">Adhésions</div><div class="num">${s.ba.total}</div>${stack(s.ba.os,s.ba.prev,s.ba.oa)}</div>
    </div>
    <div class="toolbar"><button class="btn" id="addContact">+ Ajouter un contact</button></div>
    <div class="searchbar"><span class="si">🔍</span><input id="consSearch" placeholder="Rechercher un adhérent (nom ou n°)…" value="${esc(consSearch)}" autocomplete="off"></div>
    <div id="contacts">${list.length?list.map(o=>contactCard(o.x,c.id,o.j)).join(''):'<div class="panel empty">Aucun contact sur cette période. Cliquez sur « + Ajouter un contact ».</div>'}</div>
    <div id="noneMsg" class="panel empty" hidden>Aucun adhérent ne correspond à votre recherche.</div>`;
  document.getElementById('renameC').onclick=async()=>{const n=await modalText('Renommer le conseiller','Nouveau nom :',c.name,'Renommer');if(n&&n.trim()){c.name=n.trim();persist(c,true);renderNav();render();}};
  document.getElementById('delC').onclick=async()=>{const ok=await modalConfirm('Supprimer '+c.name+' ?','Toutes ses saisies seront définitivement supprimées.','Supprimer',true);if(ok){const id=c.id;state.conseillers=state.conseillers.filter(x=>x.id!==id);saveLocal();if(fdb){try{fdb.ref('conseillers/'+id).remove().catch(()=>{});}catch(e){}}go('dash');}};
  document.getElementById('addContact').onclick=()=>{consSearch='';c.contacts.push(newContact());persist(c,true);renderConseiller(c);};
  const sb=document.getElementById('consSearch');
  if(sb){sb.oninput=()=>{consSearch=sb.value;applyConsFilter(c);};}
  bindContacts(c);
  applyConsFilter(c);
}
function applyConsFilter(c){
  const q=consSearch.trim().toLowerCase();
  const cards=document.querySelectorAll('#contacts .contact');
  let shown=0;
  cards.forEach(card=>{const x=c.contacts[+card.dataset.card];if(!x)return;
    const hay=((x.nom||'')+' '+(x.numero||'')).toLowerCase();
    const match=!q||hay.includes(q);card.hidden=!match;if(match)shown++;});
  const none=document.getElementById('noneMsg');
  if(none)none.hidden=!(q&&shown===0&&cards.length>0);
}
function refreshTiles(c){const s=stats(c);const nums=document.querySelectorAll('.tiles .tile .num');
  const ringc=document.querySelector('.tile.accent svg');
  if(ringc)ringc.outerHTML=ring(s.taux);
  if(nums.length>=3){nums[0].textContent=s.rdv;nums[1].textContent=s.propos.total;nums[2].textContent=s.ba.total;}}
function bindContacts(c){
  const box=document.getElementById('contacts');
  box.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const j=+e.target.dataset.j;c.contacts[j][f]=e.target.value;persist(c);
    if(f==='nom'){const av=e.target.closest('.contact').querySelector('.cavatar');if(av)av.textContent=e.target.value?initials(e.target.value):'—';}});
  box.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const j=+e.target.dataset.j;c.contacts[j][f]=e.target.value;persist(c);
    if(f==='date')refreshTiles(c);});
  box.addEventListener('click',async e=>{const t=e.target.closest('[data-hon],[data-del],[data-details],[data-toggle],[data-add],[data-rm]')||e.target;
    if(t.dataset.hon){const j=+t.dataset.j;c.contacts[j].honore=t.dataset.hon;persist(c);
      t.parentElement.querySelectorAll('.tg').forEach(b=>{b.classList.remove('on','ok','no');if(b.dataset.hon===t.dataset.hon)b.classList.add('on',t.dataset.hon==='NON'?'no':'ok');});refreshTiles(c);return;}
    if(t.dataset.del!=null){const j=+t.dataset.del;const nom=(c.contacts[j]&&c.contacts[j].nom)||'ce contact';const ok=await modalConfirm('Supprimer '+nom+' ?','La fiche sera définitivement supprimée.','Supprimer',true);if(ok){c.contacts.splice(j,1);persist(c,true);renderConseiller(c);}return;}
    if(t.dataset.details!=null){const j=+t.dataset.details;c.contacts[j]._open=!c.contacts[j]._open;renderConseiller(c);return;}
    if(t.dataset.toggle){const p=box.querySelector(`[data-panel="${t.dataset.toggle}"]`);if(p)p.hidden=!p.hidden;return;}
    if(t.dataset.add){const j=+t.dataset.j,arr=t.dataset.add==='propos'?c.contacts[j].propos:c.contacts[j].adhes;if(arr.length<5){arr.push(t.dataset.o);persist(c,true);renderConseiller(c);}return;}
    if(t.dataset.rm){const j=+t.dataset.j,arr=t.dataset.rm==='propos'?c.contacts[j].propos:c.contacts[j].adhes,k=arr.indexOf(t.dataset.o);if(k>-1){arr.splice(k,1);persist(c,true);renderConseiller(c);}return;}});
}

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('backdrop').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');}
document.getElementById('burger').onclick=openSidebar;
document.getElementById('backdrop').onclick=closeSidebar;
document.getElementById('sidebar').addEventListener('click',async e=>{const it=e.target.closest('[data-route]');
  if(it){go(it.dataset.route);return;}
  if(e.target.id==='navAdd'){const n=await modalText('Ajouter un conseiller','Nom du conseiller :','','Ajouter');if(n&&n.trim()){
    const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n.trim(),order:state.conseillers.length,contacts:[]};
    state.conseillers.push(c);persist(c,true);go(c.id);}}});

/* ===== synchronisation Firebase (base partagée) ===== */
function setSyncBadge(shared){const f=document.querySelector('.side-foot');if(!f)return;
  f.innerHTML=shared?'🟢 <b style="color:var(--accent-ink)">Partagé</b> — données synchronisées pour toute l\'agence, sauvegarde permanente.'
    :'💾 <b>Local</b> — données sur ce poste uniquement.';}
function fbConfigured(){return FIREBASE_CONFIG&&FIREBASE_CONFIG.databaseURL&&FIREBASE_CONFIG.databaseURL.indexOf('http')===0;}
function onFbSnap(val){
  const obj=val||{};
  const arr=Object.keys(obj).map(id=>{const v=obj[id]||{};
    return{id,name:v.name||id,order:(v.order!=null?v.order:0),contacts:Array.isArray(v.contacts)?v.contacts:[]};});
  if(!arr.length)return; // base vide : garder l'état local en attendant l'amorçage
  arr.sort((a,b)=>(a.order-b.order)||String(a.name).localeCompare(String(b.name)));
  state.conseillers=arr;saveLocal();
  const cont=document.getElementById('contacts');
  const editing=cont&&document.activeElement&&cont.contains(document.activeElement);
  if(editing){pendingRerender=true;renderNav();return;}
  renderNav();render();
}
function seedRoster(){
  const roster=['Judicaël','Stéphane','Johan','Justine','Conseiller 5'];
  fdb.ref('meta/initialized').once('value').then(s=>{
    if(s.val())return;
    const batch={};roster.forEach((n,k)=>{batch['conseillers/c'+(k+1)]={name:n,order:k,contacts:[]};});
    batch['meta/initialized']=true;
    fdb.ref().update(batch).catch(()=>{});
  }).catch(()=>{});
}
function connectFirebase(){
  if(!fbConfigured()||typeof firebase==='undefined'){setSyncBadge(false);return;}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fdb=firebase.database();
    setSyncBadge(true);
    seedRoster();
    fdb.ref('conseillers').on('value',s=>onFbSnap(s.val()),()=>setSyncBadge(false));
  }catch(e){fdb=null;setSyncBadge(false);}
}
document.addEventListener('focusout',()=>{if(!pendingRerender)return;pendingRerender=false;
  setTimeout(()=>{const cont=document.getElementById('contacts');if(!(cont&&document.activeElement&&cont.contains(document.activeElement))){renderNav();render();}},200);});

renderNav();render();connectFirebase();
</script>
