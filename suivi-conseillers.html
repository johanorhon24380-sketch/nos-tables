<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Conseillers</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    color-scheme:dark;
    --bg:#0a0f1a;--panel:#0f1826;--card:#111c2e;--elev:#16233a;
    --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.05);
    --text:#e8eef7;--muted:#8a97ab;--faint:#5f6d82;
    --accent:#12e07a;--accent-2:#0bd39b;--accent-dim:rgba(18,224,122,.14);
    --os:#34d399;--prev:#38bdf8;--oa:#fbbf24;--danger:#fb7185;--amber:#fbbf24;
    --os-b:rgba(52,211,153,.15);--prev-b:rgba(56,189,248,.15);--oa-b:rgba(251,191,36,.15);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Sora',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
    --sh:0 8px 30px rgba(0,0,0,.35);
  }
  body{font-family:var(--body);color:var(--text);background:var(--bg);
    background-image:radial-gradient(1100px 560px at 12% -8%,rgba(18,224,122,.12),transparent 58%),
                     radial-gradient(900px 520px at 102% 2%,rgba(56,189,248,.08),transparent 55%);
    background-attachment:fixed;-webkit-font-smoothing:antialiased;min-height:100vh;}
  input,select,button{font-family:inherit;}
  input[type=date]{color-scheme:dark;}
  ::selection{background:var(--accent-dim);}

  .app{display:flex;min-height:100vh;}

  /* ===== SIDEBAR ===== */
  .sidebar{width:246px;position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;padding:20px 14px;
    background:linear-gradient(180deg,#0c1626,#0a0f1a 70%);border-right:1px solid var(--line);overflow-y:auto;transition:transform .25s;}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;}
  .brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--accent),#059f5a);
    display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#05130b;font-size:1.2rem;
    box-shadow:0 6px 20px rgba(18,224,122,.35);flex-shrink:0;}
  .brand b{display:block;font-family:var(--disp);font-size:1.02rem;font-weight:700;letter-spacing:-.01em;}
  .brand span{font-size:.71rem;color:var(--muted);}
  .nav-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);margin:18px 12px 8px;font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:.9rem;font-weight:500;
    color:var(--muted);margin-bottom:3px;position:relative;transition:.16s;}
  .nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
  .nav-item.active{background:var(--accent-dim);color:#c9ffe4;font-weight:600;}
  .nav-item.active::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
    background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .nav-item .ic{width:20px;text-align:center;font-size:1rem;flex-shrink:0;opacity:.9;}
  .nav-item .av{width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;font-family:var(--mono);flex-shrink:0;}
  .nav-item.active .av{background:var(--accent);color:#05130b;border-color:transparent;}
  .nav-add{margin-top:6px;border:1px dashed var(--line);justify-content:center;font-size:.83rem;color:var(--accent-2);}
  .nav-add:hover{border-color:var(--accent);background:var(--accent-dim);}
  .side-foot{margin-top:auto;font-size:.68rem;color:var(--faint);padding:16px 10px 4px;line-height:1.6;}

  /* ===== MAIN ===== */
  .main{flex:1;margin-left:246px;min-width:0;}
  .topbar{display:none;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:30;
    background:rgba(10,15,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .burger{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);font-size:1.15rem;width:40px;height:40px;border-radius:11px;cursor:pointer;}
  .content{padding:30px 34px 90px;max-width:1160px;margin:0 auto;}

  .page-head{display:flex;align-items:center;gap:15px;margin-bottom:8px;flex-wrap:wrap;}
  .page-head h2{font-family:var(--disp);font-size:1.6rem;font-weight:700;letter-spacing:-.025em;text-wrap:balance;}
  .page-head .eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;color:var(--accent-2);font-weight:600;margin-bottom:2px;}
  .big-av{width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#059f5a);color:#05130b;
    display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:1.15rem;
    box-shadow:0 6px 20px rgba(18,224,122,.3);flex-shrink:0;}
  .sp{flex:1;}
  .mini{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;}
  .mini:hover{border-color:var(--accent);color:var(--text);}
  .period{display:flex;align-items:center;gap:9px;margin:16px 0 22px;font-size:.82rem;color:var(--muted);}
  select,.field input,.field select{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;
    padding:9px 13px;font-size:.85rem;color:var(--text);outline:none;transition:.15s;}
  select:focus,.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  option{background:#0f1826;color:var(--text);}

  /* ===== KPI TILES ===== */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:16px;margin-bottom:24px;}
  .tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:18px 20px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:var(--sh);}
  .tile::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);}
  .tile .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;}
  .tile .num{font-family:var(--mono);font-size:2.15rem;font-weight:700;letter-spacing:-.02em;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums;}
  .tile .sub{font-size:.73rem;color:var(--faint);margin-top:7px;}
  .tile.accent{background:linear-gradient(160deg,rgba(18,224,122,.16),rgba(18,224,122,.03));border-color:rgba(18,224,122,.3);}
  .tile.accent .num{color:var(--accent);}
  .tile .flex{display:flex;align-items:center;gap:16px;}
  .tile.blue .num{color:var(--prev);} .tile.amber .num{color:var(--oa);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  /* progress ring */
  .ring-txt{fill:var(--text);font-family:var(--mono);font-weight:700;}

  /* stacked category bar */
  .stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.05);margin-top:10px;}
  .stack span{display:block;height:100%;}
  .s-os{background:var(--os);} .s-prev{background:var(--prev);} .s-oa{background:var(--oa);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:12px;}
  .legend b{color:var(--text);font-family:var(--mono);}

  /* ===== PANELS / TABLES ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden;}
  .panel-h{padding:16px 20px;font-family:var(--disp);font-weight:600;font-size:.98rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  th,td{padding:13px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-2);}
  th{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600;background:rgba(255,255,255,.02);}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);}
  td{font-variant-numeric:tabular-nums;}
  tbody tr{transition:background .15s;}
  tbody tr:hover td{background:rgba(18,224,122,.05);}
  tbody tr:hover td:first-child{background:#141f31;}
  tr:last-child td{border-bottom:none;}
  tfoot td{background:rgba(18,224,122,.07)!important;font-weight:700;color:#c9ffe4;border-bottom:none;font-family:var(--mono);}
  .num-c{font-family:var(--mono);font-weight:600;}
  .grp-os{color:var(--os);} .grp-prev{color:var(--prev);} .grp-oa{color:var(--oa);}
  .rowname{cursor:pointer;color:var(--text);font-weight:600;display:inline-flex;align-items:center;gap:9px;}
  .rowname:hover{color:var(--accent);}
  .ra{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;font-family:var(--mono);}
  .stars{color:var(--amber);letter-spacing:2px;}
  .stars .off{color:rgba(255,255,255,.14);}
  .tbar{width:74px;height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
  .tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px;}

  /* ===== SAISIE — contact cards ===== */
  .toolbar{display:flex;gap:10px;margin:20px 0 16px;flex-wrap:wrap;}
  .btn{background:linear-gradient(145deg,var(--accent),#06b866);color:#05130b;border:none;border-radius:12px;padding:12px 20px;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(18,224,122,.28);transition:.15s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(18,224,122,.4);}
  .contact{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:14px;position:relative;transition:.15s;}
  .contact:hover{border-color:rgba(255,255,255,.14);}
  .status{position:absolute;top:16px;right:16px;font-size:.68rem;font-weight:700;padding:4px 11px;border-radius:50px;letter-spacing:.03em;}
  .status.ok{background:var(--os-b);color:var(--os);} .status.no{background:rgba(251,113,133,.15);color:var(--danger);}
  .frow{display:grid;grid-template-columns:1.5fr 1fr 1.2fr 1.1fr 1fr .8fr auto;gap:12px;align-items:end;padding-right:96px;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;}
  .field input,.field select{width:100%;}
  .field input::placeholder{color:var(--faint);}
  .del{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;color:var(--faint);cursor:pointer;font-size:.9rem;height:40px;width:40px;flex-shrink:0;transition:.15s;}
  .del:hover{color:var(--danger);border-color:rgba(251,113,133,.4);}

  .offers{margin-top:15px;padding-top:14px;border-top:1px solid var(--line-2);}
  .oline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .otag{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;min-width:100px;color:var(--muted);}
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:50px;padding:6px 12px;font-size:.79rem;font-weight:600;border:1px solid transparent;}
  .chip .x{cursor:pointer;opacity:.55;font-weight:700;}
  .chip .x:hover{opacity:1;}
  .chip.os{background:var(--os-b);color:var(--os);border-color:rgba(52,211,153,.28);}
  .chip.prev{background:var(--prev-b);color:var(--prev);border-color:rgba(56,189,248,.28);}
  .chip.oa{background:var(--oa-b);color:var(--oa);border-color:rgba(251,191,36,.28);}
  .addoffer{border:1px dashed var(--line);background:rgba(255,255,255,.03);border-radius:50px;padding:6px 13px;font-size:.79rem;font-weight:600;color:var(--accent-2);cursor:pointer;transition:.15s;}
  .addoffer:hover{border-color:var(--accent);color:var(--accent);}
  .cap{font-size:.7rem;color:var(--faint);}
  .offer-panel{margin-top:12px;background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .offer-grp{margin-bottom:10px;}
  .offer-grp:last-child{margin-bottom:0;}
  .offer-grp .gh{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
  .offer-grp.os .gh{color:var(--os);}.offer-grp.prev .gh{color:var(--prev);}.offer-grp.oa .gh{color:var(--oa);}
  .obtn{display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:50px;padding:6px 12px;font-size:.78rem;font-weight:600;margin:0 6px 6px 0;cursor:pointer;color:var(--text);transition:.15s;}
  .obtn:hover{border-color:var(--accent);background:var(--accent-dim);}
  .details-toggle{margin-top:14px;font-size:.79rem;color:var(--accent-2);cursor:pointer;font-weight:600;user-select:none;}
  .details-box{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;}

  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.6);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;}
    .topbar{display:flex;}
    .content{padding:18px 15px 70px;}
    .backdrop.show{display:block;}
    .frow{grid-template-columns:1fr 1fr;padding-right:0;}
    .status{position:static;display:inline-block;margin-bottom:10px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">M</div><div><b>Suivi Conseillers</b><span>MGEN · TDB Collectif 2026</span></div></div>
    <div class="nav-item" data-route="dash"><span class="ic">◈</span> Tableau de bord</div>
    <div class="nav-item" data-route="result"><span class="ic">◔</span> Suivi de résultat</div>
    <div class="nav-lbl">Conseillers</div>
    <div id="navConseillers"></div>
    <div class="nav-item nav-add" id="navAdd">+ Ajouter un conseiller</div>
    <div class="side-foot">Données enregistrées automatiquement sur ce poste.</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <div class="topbar"><button class="burger" id="burger">☰</button><b id="topTitle">Tableau de bord</b></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
"use strict";
const KEY='suiviConseillers_v4';
const ORIGINES=['Actions extérieures','Actions locales','Affaires CRM','Appel PSC','Appel entrant autre','Atelier','Campagne','Campagne reversement','Passeur','Rebond Accueil','Receveur','Recommandation','Relance tel perso','WEB service'];
const SUITES=['RDV Face à face','RDV Téléphonique','RDV Visio','Adhésion directe'];
const CATS=[{k:'os',label:'Santé'},{k:'prev',label:'Prévoyance'},{k:'oa',label:'Offres associées'}];
const OFFERS_PROPOS={
  os:['MSP','OJI','Efficience','Efficience FPH','MSPH','Santé CO'],
  prev:['Prev CO','Prev indiv','Mutex DC'],
  oa:['PJ','Epargne vie','PER en points','PER multi','CAM','Neobsia','Ass emp','santé animal','Reversement EV','Reversement RET']
};
const OFFERS_ADHES={
  os:['MSP','OJI','Efficience','Efficience FPH','MSPH','Santé CO'],
  prev:['Prev CO maintien','Prev CO conquête','Prev INDIV maintien','Prev INDIV conquête','Mutex DC'],
  oa:['PJ','Epargne vie','EV versement OK','PER pts','PER pts versement OK','PER multi','PER multi versement OK','CAM','Neobsia','Ass emp','Ass emp SUBSTIT','santé animal','Reversement EV','Reversement RET']
};
function catOf(o,set){for(const k of['os','prev','oa'])if(set[k].includes(o))return k;return 'oa';}

let state=load(),route='dash',period='all';

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return demoState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function stars(t){return t>=60?5:t>=45?4:t>=30?3:t>=15?2:1;}
function starStr(n){let s='';for(let i=1;i<=5;i++)s+=i<=n?'★':'<span class="off">★</span>';return s;}
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase()||'?';}
function newContact(){return{nom:'',numero:'',origine:'',suite:'',date:'',honore:'OUI',propos:[],adhes:[],reco:'',dateRdv2:'',dateRelance:'',dateSignature:'',commentaire:'',_open:false};}
function ex(o){return Object.assign(newContact(),o);}
function ymd(d){return d?d.slice(0,7):'';}
function demoState(){return{conseillers:[
  {name:'Judicaël',contacts:[
    ex({nom:'Bernard Alice',numero:'0104558821',origine:'Campagne',suite:'RDV Visio',date:'2026-09-06',honore:'OUI',propos:['Santé CO','Mutex DC'],adhes:['Santé CO','Mutex DC']}),
    ex({nom:'Faure Thomas',numero:'0105123998',origine:'Receveur',suite:'RDV Face à face',date:'2026-09-09',honore:'OUI',propos:['MSP','PJ','Epargne vie'],adhes:['MSP']})]},
  {name:'Stéphane',contacts:[
    ex({nom:'Durand Sophie',numero:'0103447712',origine:'Receveur',suite:'RDV Face à face',date:'2026-09-03',honore:'OUI',propos:['MSP','PJ'],adhes:['MSP']}),
    ex({nom:'Petit Luc',numero:'0102889654',origine:'Passeur',suite:'RDV Face à face',date:'2026-09-04',honore:'OUI',propos:['Efficience','Prev CO'],adhes:['Efficience']}),
    ex({nom:'Girard Emma',numero:'0106552310',origine:'Recommandation',suite:'RDV Téléphonique',date:'2026-09-08',honore:'NON'})]},
  {name:'Johan',contacts:[
    ex({nom:'Descoubes Marielle',numero:'0101465524',origine:'Appel entrant autre',suite:'RDV Face à face',date:'2026-09-01',honore:'OUI',propos:['Santé CO'],adhes:['Santé CO']}),
    ex({nom:'Vanwambeke Jolan',numero:'0106295583',origine:'Campagne',suite:'RDV Visio',date:'2026-09-02',honore:'OUI',propos:['Prev indiv','PJ','PER en points','Epargne vie'],adhes:['Prev INDIV conquête','PJ']}),
    ex({nom:'Martin Paul',numero:'0102223344',origine:'Recommandation',suite:'RDV Téléphonique',date:'2026-09-05',honore:'NON'})]},
  {name:'Justine',contacts:[
    ex({nom:'Robert Marc',numero:'0107784412',origine:'WEB service',suite:'Adhésion directe',date:'2026-09-07',honore:'OUI',propos:['MSPH'],adhes:['MSPH']})]},
  {name:'Conseiller5',contacts:[]}
]};}

function allMonths(){const s=new Set();state.conseillers.forEach(c=>c.contacts.forEach(x=>{if(x.date)s.add(ymd(x.date));}));return[...s].sort().reverse();}
function inPeriod(x){return period==='all'||ymd(x.date)===period;}
function monthLabel(m){const[y,mo]=m.split('-');return['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][+mo-1]+' '+y;}

function stats(c){const s={rdv:0,honore:0,nonHonore:0,relance:0,propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  c.contacts.filter(inPeriod).forEach(x=>{s.rdv++;if(x.honore==='NON')s.nonHonore++;else s.honore++;if(x.dateRelance)s.relance++;
    x.propos.forEach(o=>{const k=catOf(o,OFFERS_PROPOS);s.propos[k]++;s.propos.total++;});
    x.adhes.forEach(o=>{const k=catOf(o,OFFERS_ADHES);s.ba[k]++;s.ba.total++;});});
  s.taux=pct(s.ba.total,s.propos.total);s.txHonore=pct(s.honore,s.rdv);return s;}
function teamStats(){const T={rdv:0,honore:0,nonHonore:0,relance:0,propos:{os:0,prev:0,oa:0,total:0},ba:{os:0,prev:0,oa:0,total:0}};
  state.conseillers.forEach(c=>{const s=stats(c);T.rdv+=s.rdv;T.honore+=s.honore;T.nonHonore+=s.nonHonore;T.relance+=s.relance;
    ['os','prev','oa','total'].forEach(k=>{T.propos[k]+=s.propos[k];T.ba[k]+=s.ba[k];});});
  T.taux=pct(T.ba.total,T.propos.total);T.txHonore=pct(T.honore,T.rdv);return T;}

/* progress ring */
function ring(p,size=76,stroke=8,color='var(--accent)'){
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(p,100)/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"
      style="filter:drop-shadow(0 0 5px ${color})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-txt" font-size="${size*0.26}">${p}%</text></svg>`;
}
function stack(o,p,a){const t=o+p+a||1;return `<div class="stack"><span class="s-os" style="width:${o/t*100}%"></span><span class="s-prev" style="width:${p/t*100}%"></span><span class="s-oa" style="width:${a/t*100}%"></span></div>`;}
function catLegend(s){return `<div class="legend">
  <span><span class="dot" style="background:var(--os)"></span>Santé <b>${s.os}</b></span>
  <span><span class="dot" style="background:var(--prev)"></span>Prévoyance <b>${s.prev}</b></span>
  <span><span class="dot" style="background:var(--oa)"></span>Associées <b>${s.oa}</b></span></div>`;}

function renderNav(){document.getElementById('navConseillers').innerHTML=state.conseillers.map((c,i)=>
  `<div class="nav-item ${route===i?'active':''}" data-route="${i}"><span class="av">${initials(c.name)}</span>${esc(c.name)}</div>`).join('');
  document.querySelectorAll('.nav-item[data-route="dash"],.nav-item[data-route="result"]').forEach(el=>el.classList.toggle('active',el.dataset.route===route));}
function periodSelect(){const ms=allMonths();return `<div class="period">📅 Période
  <select id="periodSel"><option value="all"${period==='all'?' selected':''}>Toute l'année</option>
  ${ms.map(m=>`<option value="${m}"${period===m?' selected':''}>${monthLabel(m)}</option>`).join('')}</select></div>`;}
function go(r){route=r;renderNav();render();closeSidebar();}
function render(){document.getElementById('topTitle').textContent=route==='dash'?'Tableau de bord':route==='result'?'Suivi de résultat':state.conseillers[route].name;
  if(route==='dash')renderDash();else if(route==='result')renderResult();else renderConseiller(route);
  const ps=document.getElementById('periodSel');if(ps)ps.onchange=()=>{period=ps.value;render();};}

/* ===== DASHBOARD ===== */
function renderDash(){
  const T=teamStats();
  const rows=state.conseillers.map((c,i)=>{const s=stats(c);return `<tr>
    <td><span class="rowname" data-goto="${i}"><span class="ra">${initials(c.name)}</span>${esc(c.name)}</span></td>
    <td class="num-c">${s.rdv}</td><td class="num-c">${s.honore}</td><td class="num-c">${s.txHonore}%</td>
    <td class="num-c grp-prev">${s.propos.total}</td><td class="num-c grp-oa">${s.ba.total}</td><td class="num-c">${s.relance}</td>
    <td><div class="tbar"><span style="width:${s.taux}%"></span></div><span class="num-c">${s.taux}%</span></td>
    <td class="stars">${starStr(stars(s.taux))}</td></tr>`;}).join('');
  document.getElementById('content').innerHTML=`
    <div><div class="eyebrow">Vue d'ensemble équipe</div><div class="page-head"><h2>Tableau de bord</h2></div></div>
    ${periodSelect()}
    <div class="tiles">
      <div class="tile accent"><div class="flex">${ring(T.taux)}<div><div class="lbl">Taux de transfo</div><div class="sub">adhésions ÷ propositions</div></div></div></div>
      <div class="tile"><div class="lbl">RDV honorés</div><div class="num">${T.honore}</div><div class="sub">sur ${T.rdv} pris · ${T.txHonore}%</div></div>
      <div class="tile blue"><div class="lbl">Propositions</div><div class="num">${T.propos.total}</div>${stack(T.propos.os,T.propos.prev,T.propos.oa)}</div>
      <div class="tile amber"><div class="lbl">Adhésions (BA)</div><div class="num">${T.ba.total}</div>${stack(T.ba.os,T.ba.prev,T.ba.oa)}</div>
      <div class="tile"><div class="lbl">Relances</div><div class="num">${T.relance}</div><div class="sub">en cours de suivi</div></div>
    </div>
    <div class="panel"><div class="panel-h">Performance par conseiller</div><div class="scroll"><table>
      <thead><tr><th>Conseiller</th><th>RDV pris</th><th>Honorés</th><th>% hon.</th><th>Propos.</th><th>Adhés.</th><th>Relances</th><th>Transformation</th><th>Note</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="empty">Aucun conseiller.</td></tr>'}</tbody>
      <tfoot><tr><td>Total équipe</td><td>${T.rdv}</td><td>${T.honore}</td><td>${T.txHonore}%</td><td>${T.propos.total}</td><td>${T.ba.total}</td><td>${T.relance}</td><td>${T.taux}%</td><td></td></tr></tfoot>
    </table></div></div>
    <div class="panel" style="margin-top:18px;padding:16px 20px;font-size:.82rem;color:var(--muted);">
      <b style="color:var(--text);font-family:var(--disp);">Note ⭐ = taux de transformation</b> &nbsp;·&nbsp; ★★★★★ ≥60% · ★★★★ 45-59% · ★★★ 30-44% · ★★ 15-29% · ★ &lt;15%</div>`;
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>go(+el.dataset.goto));
}

/* ===== SUIVI DE RÉSULTAT ===== */
function renderResult(){
  const T=teamStats();
  const row=(name,s,g)=>`<tr>
    <td>${g!=null?`<span class="rowname" data-goto="${g}"><span class="ra">${initials(name)}</span>${esc(name)}</span>`:esc(name)}</td>
    <td class="num-c">${s.rdv}</td><td class="num-c">${s.honore}</td><td class="num-c" style="color:var(--danger)">${s.nonHonore}</td><td class="num-c">${s.txHonore}%</td>
    <td class="num-c grp-os">${s.propos.os}</td><td class="num-c grp-prev">${s.propos.prev}</td><td class="num-c grp-oa">${s.propos.oa}</td><td class="num-c">${s.propos.total}</td>
    <td class="num-c grp-os">${s.ba.os}</td><td class="num-c grp-prev">${s.ba.prev}</td><td class="num-c grp-oa">${s.ba.oa}</td><td class="num-c">${s.ba.total}</td>
    <td class="num-c" style="color:var(--accent)">${s.taux}%</td></tr>`;
  const rows=state.conseillers.map((c,i)=>row(c.name,stats(c),i)).join('');
  document.getElementById('content').innerHTML=`
    <div><div class="eyebrow">Analyse d'activité</div><div class="page-head"><h2>Suivi de résultat</h2></div></div>
    ${periodSelect()}
    <div class="tiles">
      <div class="tile accent"><div class="flex">${ring(T.taux)}<div><div class="lbl">Transfo générale</div><div class="sub">BA ÷ propositions</div></div></div></div>
      <div class="tile"><div class="lbl">RDV pris</div><div class="num">${T.rdv}</div><div class="sub">${T.honore} honorés · ${T.nonHonore} non</div></div>
      <div class="tile blue"><div class="lbl">Propositions</div><div class="num">${T.propos.total}</div>${stack(T.propos.os,T.propos.prev,T.propos.oa)}${catLegend(T.propos)}</div>
      <div class="tile amber"><div class="lbl">Adhésions (BA)</div><div class="num">${T.ba.total}</div>${stack(T.ba.os,T.ba.prev,T.ba.oa)}${catLegend(T.ba)}</div>
    </div>
    <div class="panel"><div class="panel-h">Détail par conseiller & catégorie</div><div class="scroll"><table>
      <thead>
        <tr><th rowspan="2">Conseiller</th><th colspan="4">RDV</th><th colspan="4">Propositions</th><th colspan="4">Adhésions (BA)</th><th rowspan="2">Transfo</th></tr>
        <tr><th>Pris</th><th>Hon.</th><th>Non</th><th>%</th><th class="grp-os">Santé</th><th class="grp-prev">Prév</th><th class="grp-oa">Assoc</th><th>Tot</th><th class="grp-os">Santé</th><th class="grp-prev">Prév</th><th class="grp-oa">Assoc</th><th>Tot</th></tr>
      </thead>
      <tbody>${rows||'<tr><td colspan="14" class="empty">Aucune donnée.</td></tr>'}</tbody>
      <tfoot>${row('Total équipe',T,null)}</tfoot>
    </table></div></div>
    <p style="color:var(--faint);font-size:.78rem;margin-top:14px;">Santé = offres santé · Prév = prévoyance · Assoc = offres associées (PJ, épargne, PER, CAM…). BA = bonnes affaires (adhésions signées).</p>`;
  document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>go(+el.dataset.goto));
}

/* ===== PAGE CONSEILLER ===== */
function chip(o,kind,ci,j){const set=kind==='propos'?OFFERS_PROPOS:OFFERS_ADHES;const k=catOf(o,set);
  return `<span class="chip ${k}">${esc(o)}<span class="x" data-rm="${kind}" data-j="${j}" data-o="${esc(o)}">✕</span></span>`;}
function offerPanel(kind,ci,j){const set=kind==='propos'?OFFERS_PROPOS:OFFERS_ADHES;
  return `<div class="offer-panel" data-panel="${kind}-${j}" hidden>${CATS.map(c=>`
    <div class="offer-grp ${c.k}"><div class="gh">${c.label}</div>
    ${set[c.k].map(o=>`<span class="obtn" data-add="${kind}" data-j="${j}" data-o="${esc(o)}">+ ${esc(o)}</span>`).join('')}</div>`).join('')}</div>`;}
function offersBlock(x,kind,ci,j){const arr=kind==='propos'?x.propos:x.adhes;const tag=kind==='propos'?'Propositions':'Adhésions';
  return `<div class="offers"><div class="oline"><span class="otag">${tag}</span>
    ${arr.map(o=>chip(o,kind,ci,j)).join('')}
    ${arr.length<5?`<span class="addoffer" data-toggle="${kind}-${j}">+ offre</span>`:'<span class="cap">(5 max)</span>'}
    </div>${offerPanel(kind,ci,j)}</div>`;}
function contactCard(x,ci,j){return `<div class="contact" data-card="${j}">
    <span class="status ${x.honore==='NON'?'no':'ok'}">${x.honore==='NON'?'RDV non honoré':'RDV honoré'}</span>
    <div class="frow">
      <div class="field"><label>Nom + prénom adhérent</label><input value="${esc(x.nom)}" data-f="nom" data-j="${j}" placeholder="Nom Prénom"></div>
      <div class="field"><label>N° adhérent</label><input value="${esc(x.numero)}" data-f="numero" data-j="${j}" placeholder="N°"></div>
      <div class="field"><label>Origine du contact</label><select data-f="origine" data-j="${j}"><option value="">—</option>${ORIGINES.map(o=>`<option ${o===x.origine?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Suite donnée</label><select data-f="suite" data-j="${j}"><option value="">—</option>${SUITES.map(o=>`<option ${o===x.suite?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Date</label><input type="date" value="${esc(x.date)}" data-f="date" data-j="${j}"></div>
      <div class="field"><label>Honoré</label><select data-f="honore" data-j="${j}"><option ${x.honore==='OUI'?'selected':''}>OUI</option><option ${x.honore==='NON'?'selected':''}>NON</option></select></div>
      <button class="del" data-del="${j}" title="Supprimer">✕</button>
    </div>
    ${offersBlock(x,'propos',ci,j)}${offersBlock(x,'adhes',ci,j)}
    <div class="details-toggle" data-details="${j}">${x._open?'▾ Masquer les détails':'▸ RECO, relance, commentaire…'}</div>
    ${x._open?`<div class="details-box">
      <div class="field"><label>RECO</label><input value="${esc(x.reco)}" data-f="reco" data-j="${j}"></div>
      <div class="field"><label>Date de RDV 2</label><input type="date" value="${esc(x.dateRdv2)}" data-f="dateRdv2" data-j="${j}"></div>
      <div class="field"><label>Date de relance</label><input type="date" value="${esc(x.dateRelance)}" data-f="dateRelance" data-j="${j}"></div>
      <div class="field"><label>Date signature (2 temps)</label><input type="date" value="${esc(x.dateSignature)}" data-f="dateSignature" data-j="${j}"></div>
      <div class="field" style="grid-column:1/-1;"><label>Commentaires</label><input value="${esc(x.commentaire)}" data-f="commentaire" data-j="${j}"></div>
    </div>`:''}</div>`;}
function renderConseiller(i){
  const c=state.conseillers[i],s=stats(c);
  const list=c.contacts.map((x,j)=>({x,j})).filter(o=>inPeriod(o.x)).reverse();
  document.getElementById('content').innerHTML=`
    <div class="page-head"><div class="big-av">${initials(c.name)}</div>
      <div><div class="eyebrow">Fiche conseiller</div><h2>${esc(c.name)}</h2></div>
      <span class="sp"></span><button class="mini" id="renameC">✎ Renommer</button><button class="mini" id="delC">🗑 Supprimer</button></div>
    ${periodSelect()}
    <div class="tiles">
      <div class="tile accent"><div class="flex">${ring(s.taux)}<div><div class="lbl">Taux de transfo</div><div class="sub">${starStr(stars(s.taux))}</div></div></div></div>
      <div class="tile"><div class="lbl">RDV pris</div><div class="num">${s.rdv}</div><div class="sub">${s.honore} honorés · ${s.txHonore}%</div></div>
      <div class="tile blue"><div class="lbl">Propositions</div><div class="num">${s.propos.total}</div>${stack(s.propos.os,s.propos.prev,s.propos.oa)}</div>
      <div class="tile amber"><div class="lbl">Adhésions</div><div class="num">${s.ba.total}</div>${stack(s.ba.os,s.ba.prev,s.ba.oa)}</div>
    </div>
    <div class="toolbar"><button class="btn" id="addContact">+ Ajouter un contact</button></div>
    <div id="contacts">${list.length?list.map(o=>contactCard(o.x,i,o.j)).join(''):'<div class="panel empty">Aucun contact sur cette période. Cliquez sur « + Ajouter un contact ».</div>'}</div>`;
  document.getElementById('renameC').onclick=()=>{const n=prompt('Renommer :',c.name);if(n&&n.trim()){c.name=n.trim();save();renderNav();render();}};
  document.getElementById('delC').onclick=()=>{if(confirm('Supprimer '+c.name+' et toutes ses saisies ?')){state.conseillers.splice(i,1);save();go('dash');}};
  document.getElementById('addContact').onclick=()=>{c.contacts.push(newContact());save();renderConseiller(i);};
  bindContacts(i);
}
function refreshTiles(i){const s=stats(state.conseillers[i]);const nums=document.querySelectorAll('.tiles .tile .num');
  const ringc=document.querySelector('.tile.accent svg');
  if(ringc)ringc.outerHTML=ring(s.taux);
  if(nums.length>=3){nums[0].textContent=s.rdv;nums[1].textContent=s.propos.total;nums[2].textContent=s.ba.total;}}
function bindContacts(i){
  const c=state.conseillers[i],box=document.getElementById('contacts');
  box.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;c.contacts[+e.target.dataset.j][f]=e.target.value;save();});
  box.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const j=+e.target.dataset.j;c.contacts[j][f]=e.target.value;save();
    if(f==='honore'){const st=e.target.closest('.contact').querySelector('.status');st.className='status '+(e.target.value==='NON'?'no':'ok');st.textContent=e.target.value==='NON'?'RDV non honoré':'RDV honoré';refreshTiles(i);}
    if(f==='date')refreshTiles(i);});
  box.addEventListener('click',e=>{const t=e.target;
    if(t.dataset.del!=null){c.contacts.splice(+t.dataset.del,1);save();renderConseiller(i);return;}
    if(t.dataset.details!=null){const j=+t.dataset.details;c.contacts[j]._open=!c.contacts[j]._open;save();renderConseiller(i);return;}
    if(t.dataset.toggle){const p=box.querySelector(`[data-panel="${t.dataset.toggle}"]`);if(p)p.hidden=!p.hidden;return;}
    if(t.dataset.add){const j=+t.dataset.j,arr=t.dataset.add==='propos'?c.contacts[j].propos:c.contacts[j].adhes;if(arr.length<5){arr.push(t.dataset.o);save();renderConseiller(i);}return;}
    if(t.dataset.rm){const j=+t.dataset.j,arr=t.dataset.rm==='propos'?c.contacts[j].propos:c.contacts[j].adhes,k=arr.indexOf(t.dataset.o);if(k>-1){arr.splice(k,1);save();renderConseiller(i);}return;}});
}

function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('backdrop').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');}
document.getElementById('burger').onclick=openSidebar;
document.getElementById('backdrop').onclick=closeSidebar;
document.getElementById('sidebar').addEventListener('click',e=>{const it=e.target.closest('[data-route]');
  if(it){const r=it.dataset.route;go(r==='dash'||r==='result'?r:+r);return;}
  if(e.target.id==='navAdd'){const n=prompt('Nom du conseiller ?');if(n&&n.trim()){state.conseillers.push({name:n.trim(),contacts:[]});save();go(state.conseillers.length-1);}}});

renderNav();render();
</script>
</body>
</html>
